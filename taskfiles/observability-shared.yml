version: "3"

tasks:
  deploy:
    desc: Deploy namespace-local Alloy and DCGM telemetry collectors
    cmds:
      - kubectl apply -f k8s/namespace.yml
      - kubectl apply -k k8s/observability
      - kubectl -n llm-runtime rollout restart daemonset/alloy
      - kubectl -n llm-runtime rollout status daemonset/alloy --timeout=180s
      - kubectl -n llm-runtime rollout status daemonset/dcgm-exporter --timeout=180s

  smoke:
    desc: Verify metrics, logs, and traces reach the shared OCO backends through Alloy
    cmds:
      - ./scripts/observability-shared-smoke.sh

  status:
    desc: Show namespace-local Alloy and DCGM telemetry resources
    cmds:
      - kubectl -n llm-runtime get daemonset/alloy daemonset/dcgm-exporter
      - kubectl -n llm-runtime get service/alloy service/dcgm-exporter
      - kubectl -n llm-runtime get configmap/alloy-config

  logs:
    desc: Follow namespace-local Alloy logs
    cmds:
      - kubectl -n llm-runtime logs daemonset/alloy -f --tail=200
