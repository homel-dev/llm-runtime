version: "3"

vars:
  ENVOY_GATEWAY_VERSION: '{{.ENVOY_GATEWAY_VERSION | default "v1.8.1"}}'
  ENVOY_AI_GATEWAY_VERSION: '{{.ENVOY_AI_GATEWAY_VERSION | default "v1.1.0"}}'

tasks:
  controllers:deploy:
    desc: Install pinned Gateway API, Envoy Gateway, and Envoy AI Gateway CRDs/controllers
    cmds:
      - |
        set -euo pipefail
        kubectl apply -f k8s/namespace.yml

        helm template eg-crds oci://docker.io/envoyproxy/gateway-crds-helm \
          --version {{.ENVOY_GATEWAY_VERSION}} \
          --set crds.gatewayAPI.enabled=true \
          --set crds.gatewayAPI.channel=standard \
          --set crds.envoyGateway.enabled=true \
          | kubectl apply --server-side --force-conflicts -f -

        for crd in \
          gateways.gateway.networking.k8s.io \
          gatewayclasses.gateway.networking.k8s.io \
          envoyproxies.gateway.envoyproxy.io \
          clienttrafficpolicies.gateway.envoyproxy.io \
          backends.gateway.envoyproxy.io
        do
          kubectl wait --for=condition=Established "crd/${crd}" --timeout=120s
        done

        helm upgrade -i eg oci://docker.io/envoyproxy/gateway-helm \
          --version {{.ENVOY_GATEWAY_VERSION}} \
          --namespace llm-runtime \
          --skip-crds \
          --values k8s/mcp/envoy-gateway-values.yml
        kubectl wait --timeout=180s -n llm-runtime \
          deployment/envoy-gateway --for=condition=Available
      - |
        set -euo pipefail
        helm upgrade -i aieg-crd oci://docker.io/envoyproxy/ai-gateway-crds-helm \
          --version {{.ENVOY_AI_GATEWAY_VERSION}} \
          --namespace llm-runtime
        kubectl wait --for=condition=Established \
          crd/mcproutes.aigateway.envoyproxy.io --timeout=120s

        if ! kubectl -n llm-runtime get secret llm-runtime-mcp-session >/dev/null 2>&1; then
          seed="$(openssl rand -hex 32)"
          kubectl -n llm-runtime create secret generic llm-runtime-mcp-session \
            --from-literal=seed="${seed}"
        fi
        seed="$(kubectl -n llm-runtime get secret llm-runtime-mcp-session -o jsonpath='{.data.seed}' | base64 -d)"
        helm upgrade -i aieg oci://docker.io/envoyproxy/ai-gateway-helm \
          --version {{.ENVOY_AI_GATEWAY_VERSION}} \
          --namespace llm-runtime \
          --values k8s/mcp/ai-gateway-values.yml \
          --set-string controller.mcp.sessionEncryption.seed="${seed}"
        kubectl wait --timeout=180s -n llm-runtime \
          deployment/ai-gateway-controller --for=condition=Available

  controllers:delete:
    desc: Remove cluster-wide Envoy AI Gateway and Envoy Gateway controllers
    prompt: This removes shared cluster-wide Envoy controllers. Continue?
    cmds:
      - helm uninstall aieg -n llm-runtime --ignore-not-found
      - helm uninstall aieg-crd -n llm-runtime --ignore-not-found
      - helm uninstall eg -n llm-runtime --ignore-not-found

  deploy:
    desc: Install prerequisites and deploy the complete llm-runtime MCP stack
    cmds:
      - task: controllers:deploy
      - kubectl apply -k k8s/mcp
      - kubectl -n llm-runtime wait --for=condition=Programmed gateway/llm-runtime-mcp --timeout=180s
      - kubectl -n llm-runtime wait --for=condition=Ready pod -l gateway.envoyproxy.io/owning-gateway-namespace=llm-runtime,gateway.envoyproxy.io/owning-gateway-name=llm-runtime-mcp --timeout=180s

  delete:
    desc: Delete llm-runtime MCP data-plane resources but preserve shared controllers
    cmds:
      - kubectl delete -k k8s/mcp --ignore-not-found=true

  status:
    desc: Show MCP Gateway controllers, route status, proxy pods, Services, and telemetry
    cmds:
      - kubectl -n llm-runtime get deploy,svc,pod -l gateway.envoyproxy.io/owning-gateway-name=llm-runtime-mcp
      - kubectl -n llm-runtime get gateway,mcproute,backend,envoyproxy,clienttrafficpolicy

  logs:
    desc: Follow MCP Envoy proxy and ext-proc logs
    cmds:
      - kubectl -n llm-runtime logs -l gateway.envoyproxy.io/owning-gateway-name=llm-runtime-mcp --all-containers=true -f --tail=200

  check:
    desc: MCP initialize + tools/list through the Envoy ingress
    cmds:
      - ./scripts/mcp-check.sh

  check:retrieval:
    desc: Invoke the exposed retrieval tool (PROJECT_ID and QUERY required)
    requires:
      vars: [PROJECT_ID, QUERY]
    cmds:
      - PROJECT_ID='{{.PROJECT_ID}}' QUERY='{{.QUERY}}' ./scripts/mcp-check.sh

  metrics:
    desc: Fetch Envoy Prometheus metrics for the MCP data plane
    cmds:
      - ./scripts/kcurl.sh llm-runtime http://llm-runtime-mcp-metrics.llm-runtime.svc.cluster.local:19001/stats/prometheus

