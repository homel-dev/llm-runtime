# Taskfile.yml
version: "3"

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  llm:deploy:
    desc: Deploy LLM runtime resources
    cmds:
      - kubectl apply -k k8s

  llm:delete:
    desc: Delete LLM runtime resources
    cmds:
      - kubectl delete -k k8s

  llm:status:
    desc: Show LLM runtime status
    cmds:
      - kubectl -n llm-runtime get pods,svc,pvc,configmap

  llm:events:
    desc: Show LLM runtime namespace events
    cmds:
      - kubectl -n llm-runtime get events --sort-by=.lastTimestamp

  llm:pods:
    desc: List LLM runtime pods
    cmds:
      - kubectl -n llm-runtime get pods -o wide

  llm:services:
    desc: List LLM runtime services
    cmds:
      - kubectl -n llm-runtime get svc

  llm:logs-small:
    desc: Follow llm-small logs
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-small -f

  llm:logs-medium:
    desc: Follow llm-medium logs
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-medium -f

  llm:logs-large:
    desc: Follow llm-large logs
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-large -f

  llm:restart-small:
    desc: Restart llm-small
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-small

  llm:restart-medium:
    desc: Restart llm-medium
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-medium

  llm:restart-large:
    desc: Restart llm-large
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-large

  llm:list-small:
    desc: List models from small tier through cluster DNS
    cmds:
      - ./scripts/kube-list-models.sh small

  llm:list-medium:
    desc: List models from medium tier through cluster DNS
    cmds:
      - ./scripts/kube-list-models.sh medium

  llm:list-large:
    desc: List models from large tier through cluster DNS
    cmds:
      - ./scripts/kube-list-models.sh large

  llm:health-small:
    desc: Health check small tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-health.sh small

  llm:health-medium:
    desc: Health check medium tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-health.sh medium

  llm:health-large:
    desc: Health check large tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-health.sh large

  llm:metrics-small:
    desc: Check vLLM /metrics endpoint on small tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-metrics.sh small

  llm:metrics-medium:
    desc: Check vLLM /metrics endpoint on medium tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-metrics.sh medium

  llm:metrics-large:
    desc: Check vLLM /metrics endpoint on large tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-metrics.sh large

  llm:smoke-small:
    desc: Smoke test small tier through cluster DNS
    cmds:
      - ./scripts/kube-smoke-chat.sh small

  llm:smoke-medium:
    desc: Smoke test medium tier through cluster DNS
    cmds:
      - ./scripts/kube-smoke-chat.sh medium

  llm:smoke-large:
    desc: Smoke test large tier through cluster DNS
    cmds:
      - ./scripts/kube-smoke-chat.sh large

  llm:benchmark-small:
    desc: Benchmark small tier through cluster DNS
    cmds:
      - ./hack/kube-benchmark.sh small

  llm:benchmark-medium:
    desc: Benchmark medium tier through cluster DNS
    cmds:
      - ./hack/kube-benchmark.sh medium

  llm:benchmark-large:
    desc: Benchmark large tier through cluster DNS
    cmds:
      - ./hack/kube-benchmark.sh large

  llm:diagnose-startup-small:
    desc: Diagnose llm-small startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh small

  llm:diagnose-startup-medium:
    desc: Diagnose llm-medium startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh medium

  llm:diagnose-startup-large:
    desc: Diagnose llm-large startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh large

  observability:deploy:
    desc: "Deploy runtime metrics resources: Prometheus and DCGM exporter"
    cmds:
      - kubectl apply -k k8s/observability

  observability:delete:
    desc: "Delete runtime metrics resources: Prometheus and DCGM exporter"
    cmds:
      - kubectl delete -k k8s/observability

  observability:status:
    desc: Show runtime metrics status
    cmds:
      - kubectl -n observability get pods,svc,configmap

  observability:events:
    desc: Show observability namespace events
    cmds:
      - kubectl -n observability get events --sort-by=.lastTimestamp

  observability:logs-prometheus:
    desc: Follow Prometheus logs
    cmds:
      - kubectl -n observability logs deploy/prometheus -f

  observability:logs-dcgm:
    desc: Follow DCGM exporter logs
    cmds:
      - kubectl -n observability logs ds/dcgm-exporter -f

  observability:expose-start:
    desc: Expose Prometheus on host/LAN port
    cmds:
      - ./scripts/observability-lan-proxy.sh start

  observability:expose-stop:
    desc: Stop host/LAN observability proxy
    cmds:
      - ./scripts/observability-lan-proxy.sh stop

  observability:expose-status:
    desc: Show host/LAN observability proxy status
    cmds:
      - ./scripts/observability-lan-proxy.sh status

  observability:urls:
    desc: Print host/LAN URL for Prometheus
    cmds:
      - ./scripts/observability-lan-proxy.sh urls


  oco-consumer:deploy:
    desc: Publish llm-runtime dashboard, datasource, and RBAC for OCO Grafana sidecars
    cmds:
      - kubectl apply -k k8s/oco-consumer

  oco-consumer:delete:
    desc: Remove llm-runtime OCO dashboard, datasource, and RBAC contract
    cmds:
      - kubectl delete -k k8s/oco-consumer

  oco-consumer:status:
    desc: Show llm-runtime OCO consumer ConfigMaps and RBAC
    cmds:
      - kubectl -n llm-runtime get configmap llm-runtime-dashboard llm-runtime-datasource
      - kubectl -n llm-runtime get role,rolebinding observability-console-reader

  observability:targets:
    desc: Print Prometheus scrape targets API output through cluster DNS
    cmds:
      - ./scripts/kcurl.sh observability http://prometheus:9090/api/v1/targets | jq .

  observability:vllm-targets:
    desc: Show Prometheus target state for vLLM scrape jobs through cluster DNS
    cmds:
      - ./scripts/kcurl.sh observability http://prometheus:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job | test("^vllm-")) | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'

  observability:vllm-up:
    desc: Query Prometheus up metric for vLLM scrape jobs through cluster DNS
    cmds:
      - ./scripts/kcurl.sh observability 'http://prometheus:9090/api/v1/query?query=up%7Bjob%3D~%22vllm-.*%22%7D' | jq .
