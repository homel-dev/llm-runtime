# Taskfile.yml
version: "3"

vars:
  GATEWAY_IMAGE:
    sh: printf '%s' "${LLM_GATEWAY_IMAGE:-ghcr.io/homel-dev/llm-runtime-gateway:main}"
  MINIKUBE_PROFILE:
    sh: printf '%s' "${MINIKUBE_PROFILE:-minikube}"

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  miniup:
    desc: Start minikube
    cmds:
      - minikube start --driver=docker --cpus=8 --memory=16384 --gpus all

  up:
    desc: Deploy LLM runtime resources
    cmds:
      - kubectl apply -k k8s
      # k8s/kustomization.yml injects part-of=llm-runtime into selectors.
      # Re-apply the policy raw so Prometheus/DCGM selectors keep their authored shape.
      - kubectl apply -f k8s/networkpolicy.yml

  down:
    desc: Delete LLM runtime resources
    cmds:
      # networkpolicy.yml is still part of k8s/kustomization.yml, so delete it once here.
      - kubectl delete -k k8s

  status:
    desc: Show LLM runtime status
    cmds:
      - kubectl -n llm-runtime get pods,svc,pvc,configmap

  llm:logs:
    desc: Follow logs for a local runtime tier (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-{{.TIER}} -f

  llm:restart:
    desc: Restart a local runtime tier (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-{{.TIER}}

  llm:list:
    desc: List a local runtime tier as advertised by the gateway (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./scripts/kube-list-models.sh {{.TIER}}

  llm:health:
    desc: End-to-end health check for a local runtime tier through the gateway (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./scripts/kube-runtime-health.sh {{.TIER}}

  llm:metrics:
    desc: Check upstream metrics from the trusted gateway Pod (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./scripts/kube-runtime-metrics.sh {{.TIER}}

  llm:benchmark:
    desc: Run the sequential gateway benchmark for a local runtime tier (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./hack/kube-benchmark.sh {{.TIER}}

  llm:diagnose-startup-large:
    desc: Diagnose llm-large vLLM startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh large

  gateway:verify:
    desc: Typecheck, build, and unit-test the llm-runtime gateway
    dir: gateway
    cmds:
      - npm ci --ignore-scripts
      - npm run verify

  gateway:image:build:
    desc: Build the gateway image (TARGET=minikube|docker, default minikube)
    vars:
      TARGET: '{{.TARGET | default "minikube"}}'
    requires:
      vars:
        - name: TARGET
          enum: [minikube, docker]
    cmds:
      - |
        if [ "{{.TARGET}}" = "minikube" ]; then
          eval "$(minikube -p {{.MINIKUBE_PROFILE}} docker-env)"
        fi
        docker build -t {{.GATEWAY_IMAGE}} gateway

  gateway:deploy:
    desc: Deploy the OpenAI-compatible gateway and all registered llm-runtime backends
    cmds:
      # Keep the base runtime policy in its known-good raw form before the gateway
      # NetworkPolicy is applied.
      - kubectl apply -f k8s/networkpolicy.yml
      - >-
        kubectl kustomize k8s/gateway | sed 's#image: llm-runtime-gateway:dev#image: {{.GATEWAY_IMAGE}}#g' | kubectl apply -f -
      - kubectl -n llm-runtime rollout restart deployment/llm-openai-api-gateway
      - kubectl -n llm-runtime rollout status deployment/llm-openai-api-gateway --timeout=180s

  gateway:delete:
    desc: Delete the llm-runtime gateway deployment/RBAC while preserving subscription PVCs
    cmds:
      - kubectl -n llm-runtime delete deployment llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete service llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete networkpolicy llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete rolebinding rr-pi-llm-service-reader --ignore-not-found=true
      - kubectl -n llm-runtime delete role rr-pi-llm-service-reader --ignore-not-found=true

  gateway:status:
    desc: Show gateway deployment, Service, auth PVCs, and current advertised models
    cmds:
      - kubectl -n llm-runtime get deployment/llm-openai-api-gateway service/llm-openai-api-gateway pvc/rr-openai-subscription-auth pvc/rr-gemini-subscription-auth
      - kubectl -n llm-runtime exec deployment/llm-openai-api-gateway -c gateway -- node -e 'fetch("http://127.0.0.1:8000/v1/models").then(async r=>{const t=await r.text(); console.log(t); if(!r.ok)process.exit(1)})'

  gateway:logs:
    desc: Follow all llm-runtime gateway containers
    cmds:
      - kubectl -n llm-runtime logs deployment/llm-openai-api-gateway --all-containers=true -f

  gateway:metrics:
    desc: Fetch gateway Prometheus metrics from the dedicated metrics port
    cmds:
      - kubectl -n llm-runtime exec deployment/llm-openai-api-gateway -c gateway -- node -e 'fetch("http://127.0.0.1:9091/metrics").then(async r=>{const t=await r.text(); process.stdout.write(t); if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})'

  gateway:observability:deploy:
    desc: Deploy Prometheus scrape config and OCO/Grafana dashboard for the gateway
    cmds:
      - task: observability:deploy
      - task: oco-consumer:deploy
      - task: observability:targets
        vars: { JOB: gateway }

  gateway:openai:login:
    desc: Populate the ChatGPT/Codex subscription auth PVC from an interactive helper Pod
    cmds:
      - LLM_GATEWAY_IMAGE='{{.GATEWAY_IMAGE}}' ./scripts/gateway-openai-subscription-login.sh

  gateway:gemini:login:
    desc: Populate the Google AI subscription auth PVC using Antigravity CLI and verify cached headless auth
    cmds:
      - LLM_GATEWAY_IMAGE='{{.GATEWAY_IMAGE}}' ./scripts/gateway-gemini-subscription-login.sh

  gateway:check:
    desc: End-to-end check advertised gateway models (PROVIDER=all|openai|gemini|local|api, default all)
    vars:
      PROVIDER: '{{.PROVIDER | default "all"}}'
    requires:
      vars:
        - name: PROVIDER
          enum: [all, openai, gemini, local, api]
    cmds:
      - ./scripts/gateway-check-models.sh {{.PROVIDER}}

  observability:deploy:
    desc: "Deploy runtime metrics resources: Prometheus and DCGM exporter"
    cmds:
      - kubectl apply -k k8s/observability
      - kubectl -n llm-runtime rollout restart deployment/prometheus
      - kubectl -n llm-runtime rollout status deployment/prometheus --timeout=120s

  observability:delete:
    desc: "Delete runtime metrics resources: Prometheus and DCGM exporter"
    cmds:
      - kubectl delete -k k8s/observability

  observability:status:
    desc: Show Prometheus and DCGM exporter status
    cmds:
      - kubectl -n llm-runtime get deployment/prometheus daemonset/dcgm-exporter service/prometheus service/dcgm-exporter configmap/prometheus-config

  observability:logs:
    desc: Follow observability logs (COMPONENT=prometheus|dcgm)
    requires:
      vars:
        - name: COMPONENT
          enum: [prometheus, dcgm]
    cmds:
      - |
        case "{{.COMPONENT}}" in
          prometheus) kubectl -n llm-runtime logs deploy/prometheus -f ;;
          dcgm)       kubectl -n llm-runtime logs ds/dcgm-exporter -f ;;
        esac

  oco-consumer:deploy:
    desc: Publish llm-runtime dashboard, datasource, and RBAC for OCO Grafana sidecars
    cmds:
      - kubectl apply -k k8s/oco-consumer

  oco-consumer:delete:
    desc: Remove llm-runtime OCO dashboard, datasource, and RBAC contract
    cmds:
      - kubectl delete -k k8s/oco-consumer

  oco-consumer:status:
    desc: Show llm-runtime OCO consumer ConfigMaps and RBAC
    cmds:
      - kubectl -n llm-runtime get configmap llm-runtime-dashboard llm-runtime-gateway-dashboard llm-runtime-datasource
      - kubectl -n llm-runtime get role,rolebinding observability-console-reader

  observability:targets:
    desc: Show Prometheus scrape targets (JOB=all|vllm|gateway, default all)
    vars:
      JOB: '{{.JOB | default "all"}}'
    requires:
      vars:
        - name: JOB
          enum: [all, vllm, gateway]
    cmds:
      - |
        case "{{.JOB}}" in
          all)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets | jq .
            ;;
          vllm)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets \
              | jq '.data.activeTargets[] | select(.labels.job | test("^vllm-")) | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'
            ;;
          gateway)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets \
              | jq '.data.activeTargets[] | select(.labels.job == "llm-gateway") | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'
            ;;
        esac

  observability:up:
    desc: Query Prometheus up metrics (JOB=all|vllm|gateway, default all)
    vars:
      JOB: '{{.JOB | default "all"}}'
    requires:
      vars:
        - name: JOB
          enum: [all, vllm, gateway]
    cmds:
      - |
        case "{{.JOB}}" in
          all)     query='up' ;;
          vllm)    query='up{job=~"vllm-.*"}' ;;
          gateway) query='up{job="llm-gateway"}' ;;
        esac
        ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/query \
          --get \
          --data-urlencode "query=${query}" | jq .
