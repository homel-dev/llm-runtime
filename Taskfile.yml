# Taskfile.yml
version: "3"

vars:
  GATEWAY_IMAGE:
    sh: printf '%s' "${LLM_GATEWAY_IMAGE:-ghcr.io/homel-dev/llm-runtime-gateway:main}"
  MINIKUBE_PROFILE:
    sh: printf '%s' "${MINIKUBE_PROFILE:-minikube}"

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  miniup:
    desc: Start minikube
    cmds:
      - minikube start --driver=docker --cpus=8 --memory=16384 --gpus all

  up:
    desc: Deploy LLM runtime resources
    cmds:
      - kubectl apply -k k8s

  down:
    desc: Delete LLM runtime resources
    cmds:
      - kubectl delete -k k8s

  status:
    desc: Show LLM runtime status
    cmds:
      - kubectl -n llm-runtime get pods,svc,pvc,configmap

  llm:logs-small:
    desc: Follow llm-small logs
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-small -f

  llm:logs-medium:
    desc: Follow llm-medium logs
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-medium -f

  llm:logs-large:
    desc: Follow llm-large logs
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-large -f

  llm:restart-small:
    desc: Restart llm-small
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-small

  llm:restart-medium:
    desc: Restart llm-medium
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-medium

  llm:restart-large:
    desc: Restart llm-large
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-large

  llm:list-small:
    desc: List models from small tier through cluster DNS
    cmds:
      - ./scripts/kube-list-models.sh small

  llm:list-medium:
    desc: List models from medium tier through cluster DNS
    cmds:
      - ./scripts/kube-list-models.sh medium

  llm:list-large:
    desc: List models from large tier through cluster DNS
    cmds:
      - ./scripts/kube-list-models.sh large

  llm:health-small:
    desc: Health check small tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-health.sh small

  llm:health-medium:
    desc: Health check medium tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-health.sh medium

  llm:health-large:
    desc: Health check large tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-health.sh large

  llm:metrics-small:
    desc: Check vLLM /metrics endpoint on small tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-metrics.sh small

  llm:metrics-medium:
    desc: Check vLLM /metrics endpoint on medium tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-metrics.sh medium

  llm:metrics-large:
    desc: Check vLLM /metrics endpoint on large tier through cluster DNS
    cmds:
      - ./scripts/kube-runtime-metrics.sh large

  llm:smoke-small:
    desc: Smoke test small tier through cluster DNS
    cmds:
      - ./scripts/kube-smoke-chat.sh small

  llm:smoke-medium:
    desc: Smoke test medium tier through cluster DNS
    cmds:
      - ./scripts/kube-smoke-chat.sh medium

  llm:smoke-large:
    desc: Smoke test large tier through cluster DNS
    cmds:
      - ./scripts/kube-smoke-chat.sh large

  llm:benchmark-small:
    desc: Benchmark small tier through cluster DNS
    cmds:
      - ./hack/kube-benchmark.sh small

  llm:benchmark-medium:
    desc: Benchmark medium tier through cluster DNS
    cmds:
      - ./hack/kube-benchmark.sh medium

  llm:benchmark-large:
    desc: Benchmark large tier through cluster DNS
    cmds:
      - ./hack/kube-benchmark.sh large

  llm:diagnose-startup-small:
    desc: Diagnose llm-small startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh small

  llm:diagnose-startup-medium:
    desc: Diagnose llm-medium startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh medium

  llm:diagnose-startup-large:
    desc: Diagnose llm-large startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh large


  gateway:verify:
    desc: Typecheck, build, and unit-test the llm-runtime gateway
    dir: gateway
    cmds:
      - npm ci --ignore-scripts
      - npm run verify

  gateway:image:build:docker:
    desc: Build the llm-runtime gateway image in the current Docker daemon
    cmds:
      - docker build -t {{.GATEWAY_IMAGE}} gateway

  gateway:image:build:
    desc: Build the llm-runtime gateway image directly into the minikube Docker daemon
    cmds:
      - |
        eval "$(minikube -p {{.MINIKUBE_PROFILE}} docker-env)"
        docker build -t {{.GATEWAY_IMAGE}} gateway

  gateway:deploy:
    desc: Deploy the OpenAI-compatible gateway and subscription backends owned by llm-runtime
    cmds:
      # The old runtime policy selected every Pod in the namespace. Narrow it
      # before applying the gateway policy or NetworkPolicy union semantics would
      # keep port 8000 broadly reachable.
      - kubectl apply -f k8s/networkpolicy.yml
      - >-
        kubectl kustomize k8s/gateway | sed 's#image: llm-runtime-gateway:dev#image: {{.GATEWAY_IMAGE}}#g' | kubectl apply -f -
      - kubectl -n llm-runtime rollout status deployment/llm-openai-api-gateway --timeout=180s

  gateway:delete:
    desc: Delete the llm-runtime gateway deployment/RBAC while preserving subscription PVCs
    cmds:
      - kubectl -n llm-runtime delete deployment llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete service llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete networkpolicy llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete rolebinding rr-pi-llm-service-reader --ignore-not-found=true
      - kubectl -n llm-runtime delete role rr-pi-llm-service-reader --ignore-not-found=true

  gateway:status:
    desc: Show gateway deployment, Service, auth PVCs, and current advertised models
    cmds:
      - kubectl -n llm-runtime get deployment/llm-openai-api-gateway service/llm-openai-api-gateway pvc/rr-openai-subscription-auth pvc/rr-gemini-subscription-auth
      - kubectl -n llm-runtime exec deployment/llm-openai-api-gateway -c gateway -- node -e 'fetch("http://127.0.0.1:8000/v1/models").then(async r=>{const t=await r.text(); console.log(t); if(!r.ok)process.exit(1)})'

  gateway:logs:
    desc: Follow all llm-runtime gateway containers
    cmds:
      - kubectl -n llm-runtime logs deployment/llm-openai-api-gateway --all-containers=true -f

  gateway:metrics:
    desc: Fetch gateway Prometheus metrics from the dedicated metrics port
    cmds:
      - kubectl -n llm-runtime exec deployment/llm-openai-api-gateway -c gateway -- node -e 'fetch("http://127.0.0.1:9091/metrics").then(async r=>{const t=await r.text(); process.stdout.write(t); if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})'

  gateway:observability:deploy:
    desc: Deploy Prometheus scrape config and OCO/Grafana dashboard for the gateway
    cmds:
      - task: observability:deploy
      - task: oco-consumer:deploy
      - task: observability:gateway-target

  gateway:subscription:login:
    desc: Populate the ChatGPT/Codex OAuth PVC from an interactive helper Pod
    cmds:
      - LLM_GATEWAY_IMAGE='{{.GATEWAY_IMAGE}}' ./scripts/gateway-openai-subscription-login.sh

  gateway:gemini:login:
    desc: Populate the Google AI subscription auth PVC using Antigravity CLI and verify cached headless auth
    cmds:
      - LLM_GATEWAY_IMAGE='{{.GATEWAY_IMAGE}}' ./scripts/gateway-gemini-subscription-login.sh

  gateway:gemini:check:
    desc: End-to-end Gemini subscription smoke through the OpenAI-compatible gateway
    cmds:
      - ./scripts/gateway-gemini-check.sh

  observability:deploy:
    desc: "Deploy runtime metrics resources: Prometheus and DCGM exporter"
    cmds:
      - kubectl apply -k k8s/observability
      - kubectl -n llm-runtime rollout restart deployment/prometheus
      - kubectl -n llm-runtime rollout status deployment/prometheus --timeout=120s

  observability:delete:
    desc: "Delete runtime metrics resources: Prometheus and DCGM exporter"
    cmds:
      - kubectl delete -k k8s/observability

  observability:status:
    desc: Show runtime metrics status
    cmds:
      - kubectl -n llm-runtime get pods,svc,configmap

  observability:events:
    desc: Show observability namespace events
    cmds:
      - kubectl -n llm-runtime get events --sort-by=.lastTimestamp

  observability:logs-prometheus:
    desc: Follow Prometheus logs
    cmds:
      - kubectl -n llm-runtime logs deploy/prometheus -f

  observability:logs-dcgm:
    desc: Follow DCGM exporter logs
    cmds:
      - kubectl -n llm-runtime logs ds/dcgm-exporter -f

  observability:expose-start:
    desc: Expose Prometheus on host/LAN port
    cmds:
      - ./scripts/observability-lan-proxy.sh start

  observability:expose-stop:
    desc: Stop host/LAN observability proxy
    cmds:
      - ./scripts/observability-lan-proxy.sh stop

  observability:expose-status:
    desc: Show host/LAN observability proxy status
    cmds:
      - ./scripts/observability-lan-proxy.sh status

  observability:urls:
    desc: Print host/LAN URL for Prometheus
    cmds:
      - ./scripts/observability-lan-proxy.sh urls


  oco-consumer:deploy:
    desc: Publish llm-runtime dashboard, datasource, and RBAC for OCO Grafana sidecars
    cmds:
      - kubectl apply -k k8s/oco-consumer

  oco-consumer:delete:
    desc: Remove llm-runtime OCO dashboard, datasource, and RBAC contract
    cmds:
      - kubectl delete -k k8s/oco-consumer

  oco-consumer:status:
    desc: Show llm-runtime OCO consumer ConfigMaps and RBAC
    cmds:
      - kubectl -n llm-runtime get configmap llm-runtime-dashboard llm-runtime-gateway-dashboard llm-runtime-datasource
      - kubectl -n llm-runtime get role,rolebinding observability-console-reader

  observability:targets:
    desc: Print Prometheus scrape targets API output through cluster DNS
    cmds:
      - ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets | jq .

  observability:vllm-targets:
    desc: Show Prometheus target state for vLLM scrape jobs through cluster DNS
    cmds:
      - ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job | test("^vllm-")) | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'

  observability:vllm-up:
    desc: Query Prometheus up metric for vLLM scrape jobs through cluster DNS
    cmds:
      - ./scripts/kcurl.sh llm-runtime 'http://prometheus:9090/api/v1/query?query=up%7Bjob%3D~%22vllm-.*%22%7D' | jq .

  observability:gateway-target:
    desc: Show Prometheus target state for the llm gateway
    cmds:
      - ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job == "llm-gateway") | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'

  observability:gateway-up:
    desc: Query Prometheus up metric for the llm gateway
    cmds:
      - ./scripts/kcurl.sh llm-runtime 'http://prometheus:9090/api/v1/query?query=up%7Bjob%3D%22llm-gateway%22%7D' | jq .
