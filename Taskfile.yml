# Taskfile.yml
version: "3"

vars:
  GATEWAY_IMAGE:
    sh: printf '%s' "${LLM_GATEWAY_IMAGE:-ghcr.io/homel-dev/llm-runtime-gateway:main}"
  OMNIROUTE_IMAGE:
    sh: printf '%s' "${OMNIROUTE_IMAGE:-docker.io/diegosouzapw/omniroute:next}"
  MINIKUBE_PROFILE:
    sh: printf '%s' "${MINIKUBE_PROFILE:-minikube}"

includes:
  mcp:
    taskfile: ./taskfiles/mcp.yml
    dir: .
  obs:
    taskfile: ./taskfiles/observability-shared.yml
    dir: .

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  miniup:
    desc: Start minikube
    cmds:
      - minikube start --driver=docker --cpus=8 --memory=16384 --gpus all

  up:
    desc: Deploy LLM runtime resources
    cmds:
      - kubectl apply -k k8s
      # k8s/kustomization.yml injects part-of=llm-runtime into selectors.
      # Re-apply the policy raw so Prometheus/DCGM selectors keep their authored shape.
      - kubectl apply -f k8s/networkpolicy.yml

  down:
    desc: Delete LLM runtime resources
    cmds:
      # networkpolicy.yml is still part of k8s/kustomization.yml, so delete it once here.
      - kubectl delete -k k8s

  status:
    desc: Show LLM runtime status
    cmds:
      - kubectl -n llm-runtime get pods,svc,pvc,configmap

  llm:logs:
    desc: Follow logs for a local runtime tier (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - kubectl -n llm-runtime logs deploy/llm-{{.TIER}} -f

  llm:restart:
    desc: Restart a local runtime tier (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - kubectl -n llm-runtime rollout restart deploy/llm-{{.TIER}}

  llm:down:
    desc: Down all
    cmds:
      - kubectl delete -n llm-runtime deployments.apps llm-large
      - kubectl delete -n llm-runtime deployments.apps llm-small

  llm:list:
    desc: List a local runtime tier as advertised by the gateway (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./scripts/kube-list-models.sh {{.TIER}}

  llm:health:
    desc: End-to-end health check for a local runtime tier through the gateway (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./scripts/kube-runtime-health.sh {{.TIER}}

  llm:metrics:
    desc: Check upstream metrics from the trusted gateway Pod (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./scripts/kube-runtime-metrics.sh {{.TIER}}

  llm:benchmark:
    desc: Run the sequential gateway benchmark for a local runtime tier (TIER=small|large)
    requires:
      vars:
        - name: TIER
          enum: [small, large]
    cmds:
      - ./hack/kube-benchmark.sh {{.TIER}}

  llm:diagnose-startup-large:
    desc: Diagnose llm-large vLLM startup state
    cmds:
      - ./scripts/vllm-startup-diagnose.sh large

  gateway:verify:
    desc: Typecheck, build, and unit-test the llm-runtime gateway
    dir: gateway
    cmds:
      - npm ci --ignore-scripts
      - npm run verify

  gateway:image:build:
    desc: Build the gateway image (TARGET=minikube|docker, default minikube)
    vars:
      TARGET: '{{.TARGET | default "minikube"}}'
    requires:
      vars:
        - name: TARGET
          enum: [minikube, docker]
    cmds:
      - |
        if [ "{{.TARGET}}" = "minikube" ]; then
          eval "$(minikube -p {{.MINIKUBE_PROFILE}} docker-env)"
        fi
        docker build -t {{.GATEWAY_IMAGE}} gateway

  gateway:deploy:
    desc: Deploy the OpenAI-compatible gateway and all registered llm-runtime backends
    cmds:
      # Keep the base runtime policy in its known-good raw form before the gateway
      # NetworkPolicy is applied.
      - kubectl apply -f k8s/networkpolicy.yml
      - >-
        kubectl kustomize k8s/gateway | sed 's#image: llm-runtime-gateway:dev#image: {{.GATEWAY_IMAGE}}#g' | kubectl apply -f -
      - kubectl -n llm-runtime rollout restart deployment/llm-openai-api-gateway
      - kubectl -n llm-runtime rollout status deployment/llm-openai-api-gateway --timeout=180s

  gateway:delete:
    desc: Delete the llm-runtime gateway deployment/RBAC while preserving subscription PVCs
    cmds:
      - kubectl -n llm-runtime delete deployment llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete service llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete networkpolicy llm-openai-api-gateway --ignore-not-found=true
      - kubectl -n llm-runtime delete rolebinding rr-pi-llm-service-reader --ignore-not-found=true
      - kubectl -n llm-runtime delete role rr-pi-llm-service-reader --ignore-not-found=true

  gateway:status:
    desc: Show gateway deployment, Service, auth PVCs, and current advertised models
    cmds:
      - kubectl -n llm-runtime get deployment/llm-openai-api-gateway service/llm-openai-api-gateway pvc/rr-openai-subscription-auth pvc/rr-gemini-subscription-auth secret/rr-zai-coding
      - kubectl -n llm-runtime exec deployment/llm-openai-api-gateway -c gateway -- node -e 'fetch("http://127.0.0.1:8000/v1/models").then(async r=>{const t=await r.text(); console.log(t); if(!r.ok)process.exit(1)})'

  gateway:logs:
    desc: Follow all llm-runtime gateway containers
    cmds:
      - kubectl -n llm-runtime logs deployment/llm-openai-api-gateway --all-containers=true -f

  gateway:metrics:
    desc: Fetch gateway Prometheus metrics from the dedicated metrics port
    cmds:
      - kubectl -n llm-runtime exec deployment/llm-openai-api-gateway -c gateway -- node -e 'fetch("http://127.0.0.1:9091/metrics").then(async r=>{const t=await r.text(); process.stdout.write(t); if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})'

  gateway:observability:deploy:
    desc: Deploy Prometheus scrape config and OCO/Grafana dashboard for the gateway
    cmds:
      - task: observability:deploy
      - task: oco-consumer:deploy
      - task: observability:targets
        vars: { JOB: gateway }

  gateway:openai:login:
    desc: Populate the ChatGPT/Codex subscription auth PVC from an interactive helper Pod
    cmds:
      - LLM_GATEWAY_IMAGE='{{.GATEWAY_IMAGE}}' ./scripts/gateway-openai-subscription-login.sh

  gateway:gemini:login:
    desc: Populate the Google AI subscription auth PVC using Antigravity CLI and verify cached headless auth
    cmds:
      - LLM_GATEWAY_IMAGE='{{.GATEWAY_IMAGE}}' ./scripts/gateway-gemini-subscription-login.sh

  gateway:zai:secret:
    desc: Create or update the Z.AI Coding Plan API-key Secret from ZAI_API_KEY
    cmds:
      - |
        test -n "${ZAI_API_KEY:-}" || { echo "ZAI_API_KEY is required" >&2; exit 2; }
        kubectl -n llm-runtime create secret generic rr-zai-coding \
          --from-literal=api-key="$ZAI_API_KEY" \
          --dry-run=client -o yaml | kubectl apply -f -

  gateway:check:
    desc: End-to-end check advertised gateway models (PROVIDER=all|openai|gemini|zai|local|api, default all)
    vars:
      PROVIDER: '{{.PROVIDER | default "all"}}'
    requires:
      vars:
        - name: PROVIDER
          enum: [all, openai, gemini, zai, local, api]
    cmds:
      - ./scripts/gateway-check-models.sh {{.PROVIDER}}

  omniroute:secret:
    desc: Create OmniRoute bootstrap Secret from OMNIROUTE_* environment variables (fails if it already exists)
    cmds:
      - |
        : "${OMNIROUTE_INITIAL_PASSWORD:?OMNIROUTE_INITIAL_PASSWORD is required}"
        : "${OMNIROUTE_JWT_SECRET:?OMNIROUTE_JWT_SECRET is required}"
        : "${OMNIROUTE_API_KEY_SECRET:?OMNIROUTE_API_KEY_SECRET is required}"
        : "${OMNIROUTE_STORAGE_ENCRYPTION_KEY:?OMNIROUTE_STORAGE_ENCRYPTION_KEY is required}"
        : "${OMNIROUTE_MACHINE_ID_SALT:?OMNIROUTE_MACHINE_ID_SALT is required}"
        : "${OMNIROUTE_WS_BRIDGE_SECRET:?OMNIROUTE_WS_BRIDGE_SECRET is required}"
        kubectl -n llm-runtime create secret generic omniroute-runtime \
          --from-literal=initial-password="$OMNIROUTE_INITIAL_PASSWORD" \
          --from-literal=jwt-secret="$OMNIROUTE_JWT_SECRET" \
          --from-literal=api-key-secret="$OMNIROUTE_API_KEY_SECRET" \
          --from-literal=storage-encryption-key="$OMNIROUTE_STORAGE_ENCRYPTION_KEY" \
          --from-literal=machine-id-salt="$OMNIROUTE_MACHINE_ID_SALT" \
          --from-literal=ws-bridge-secret="$OMNIROUTE_WS_BRIDGE_SECRET"

  omniroute:deploy:
    desc: Deploy OmniRoute as a parallel experimental gateway
    cmds:
      - kubectl -n llm-runtime get secret/omniroute-runtime >/dev/null
      - >-
        kubectl kustomize k8s/omniroute | sed 's#image: omniroute:dev#image: {{.OMNIROUTE_IMAGE}}#g' | kubectl apply -f -
      - kubectl -n llm-runtime rollout status deployment/omniroute-redis --timeout=120s
      - kubectl -n llm-runtime rollout status deployment/omniroute --timeout=300s

  omniroute:delete:
    desc: Delete OmniRoute workloads while preserving its PVC and Secrets
    cmds:
      - kubectl -n llm-runtime delete deployment omniroute omniroute-redis --ignore-not-found=true
      - kubectl -n llm-runtime delete service omniroute llm-openai-api-gateway-omniroute omniroute-redis --ignore-not-found=true
      - kubectl -n llm-runtime delete networkpolicy omniroute omniroute-redis allow-omniroute-to-inference --ignore-not-found=true

  omniroute:status:
    desc: Show OmniRoute deployment, Services, PVC, Redis, and bootstrap/operator Secrets
    cmds:
      - kubectl -n llm-runtime get deployment/omniroute deployment/omniroute-redis service/omniroute service/llm-openai-api-gateway-omniroute service/omniroute-redis pvc/omniroute-data secret/omniroute-runtime
      - kubectl -n llm-runtime get secret/omniroute-operator-token --ignore-not-found=true

  omniroute:logs:
    desc: Follow OmniRoute logs
    cmds:
      - kubectl -n llm-runtime logs deployment/omniroute -f

  omniroute:redis:logs:
    desc: Follow OmniRoute Redis logs
    cmds:
      - kubectl -n llm-runtime logs deployment/omniroute-redis -f

  omniroute:ui:
    desc: Port-forward OmniRoute UI/API to http://localhost:20128
    cmds:
      - kubectl -n llm-runtime port-forward deployment/omniroute 20128:20128 20132:20132 1455:1455

  omniroute:health:
    desc: Check OmniRoute lifecycle endpoints from inside the Pod
    cmds:
      - ./scripts/omniroute-request.sh GET /healthz --no-auth
      - ./scripts/omniroute-request.sh GET /livez --no-auth

  omniroute:endpoint:check:
    desc: Check the parallel OpenAI-compatible OmniRoute Service endpoint from an in-cluster operator-check Pod
    cmds:
      - ./scripts/kcurl.sh llm-runtime http://llm-openai-api-gateway-omniroute.llm-runtime.svc.cluster.local:8000/healthz

  omniroute:operator-token:
    desc: Mint an OmniRoute admin CLI token from the bootstrap password and store it in a Kubernetes Secret
    cmds:
      - ./scripts/omniroute-operator-token.sh

  omniroute:providers:
    desc: List configured OmniRoute provider connections
    cmds:
      - ./scripts/omniroute-request.sh GET /api/providers

  omniroute:providers:test:
    desc: Test all active OmniRoute provider connections
    cmds:
      - |
        result="$(./scripts/omniroute-request.sh POST /api/providers/test-batch '{"mode":"all"}')"
        printf '%s\n' "$result" | jq -e '.summary.total > 0 and .summary.failed == 0 and .summary.passed == .summary.total'

  omniroute:configure-runtime:
    desc: Configure native GLM and local providers plus stable RR model aliases
    cmds:
      - ./scripts/omniroute-configure-runtime.sh

  omniroute:auth:status:
    desc: Show native OmniRoute Codex and Antigravity OAuth connection state
    cmds:
      - >-
        ./scripts/omniroute-request.sh GET /api/providers
        | jq '{codex: [.connections[] | select(.provider == "codex") | {id,name,isActive,testStatus}], agy: [.connections[] | select(.provider == "agy") | {id,name,isActive,testStatus}]}'

  omniroute:auth:check:
    desc: Require independent active Codex and Antigravity OAuth connections in OmniRoute
    cmds:
      - >-
        ./scripts/omniroute-request.sh GET /api/providers
        | jq -e '([.connections[] | select(.provider == "codex" and .isActive == true)] | length) > 0 and ([.connections[] | select(.provider == "agy" and .isActive == true)] | length) > 0'

  omniroute:runtime:check:
    desc: Verify the parallel endpoint advertises every RR runtime model alias
    cmds:
      - |
        set -eu
        models="$(./scripts/kcurl.sh llm-runtime http://llm-openai-api-gateway-omniroute.llm-runtime.svc.cluster.local:8000/v1/models)"
        for model in llm-small llm-large gpt-5.6-sol gemini-subscription-pro gemini-subscription-auto glm-5.3 glm-5.3-flash
        do
          printf '%s\n' "$models" | jq -e --arg model "$model" '.data | any(.id == $model)' >/dev/null || {
            echo "OmniRoute model missing: $model" >&2
            exit 1
          }
        done
        echo "OK: OmniRoute advertises all RR runtime model aliases"

  omniroute:combos:
    desc: List OmniRoute routing combos
    cmds:
      - ./scripts/omniroute-request.sh GET /api/combos

  omniroute:deep-health:
    desc: Fetch OmniRoute deep monitoring health
    cmds:
      - ./scripts/omniroute-request.sh GET /api/monitoring/health

  omniroute:backup:
    desc: Create an OmniRoute database backup through the management API
    cmds:
      - ./scripts/omniroute-request.sh PUT /api/db-backups '{}'

  omniroute:check:
    desc: Run OmniRoute health, native-auth, provider, model-catalog, and combo checks
    cmds:
      - task: omniroute:health
      - task: omniroute:auth:check
      - task: omniroute:providers:test
      - task: omniroute:runtime:check
      - task: omniroute:combos

  omniroute:observability:deploy:
    desc: Deploy OmniRoute metrics/log/trace plumbing and the OCO dashboard
    cmds:
      - task: observability:deploy
      - task: oco-consumer:deploy
      - task: omniroute:observability:check

  omniroute:observability:check:
    desc: Validate OmniRoute blackbox telemetry and show span-derived RED metrics when traffic exists
    cmds:
      - >-
        ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/query
        --get --data-urlencode 'query=max(probe_success{job="omniroute-blackbox"})'
        | jq -e '.data.result | length == 1 and .data.result[0].value[1] == "1"'
      - >-
        ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/query
        --get --data-urlencode 'query=sum(rate(omniroute_calls_total[5m]))'
        | jq '.data.result'
      - kubectl -n llm-runtime get configmap/llm-runtime-omniroute-dashboard

  observability:deploy:
    desc: "Deploy runtime telemetry resources: Prometheus, Alloy, blackbox exporter, and DCGM exporter"
    cmds:
      - kubectl apply -k k8s/observability
      - kubectl -n llm-runtime rollout restart daemonset/alloy deployment/prometheus deployment/blackbox-exporter
      - kubectl -n llm-runtime rollout status daemonset/alloy --timeout=120s
      - kubectl -n llm-runtime rollout status deployment/prometheus --timeout=120s
      - kubectl -n llm-runtime rollout status deployment/blackbox-exporter --timeout=120s

  observability:delete:
    desc: "Delete runtime telemetry resources: Prometheus, Alloy, blackbox exporter, and DCGM exporter"
    cmds:
      - kubectl delete -k k8s/observability

  observability:status:
    desc: Show Prometheus, Alloy, blackbox exporter, and DCGM exporter status
    cmds:
      - kubectl -n llm-runtime get deployment/prometheus deployment/blackbox-exporter daemonset/alloy daemonset/dcgm-exporter service/prometheus service/alloy service/blackbox-exporter service/dcgm-exporter configmap/prometheus-config

  observability:logs:
    desc: Follow observability logs (COMPONENT=prometheus|alloy|blackbox|dcgm)
    requires:
      vars:
        - name: COMPONENT
          enum: [prometheus, alloy, blackbox, dcgm]
    cmds:
      - |
        case "{{.COMPONENT}}" in
          prometheus) kubectl -n llm-runtime logs deploy/prometheus -f ;;
          alloy)      kubectl -n llm-runtime logs ds/alloy -f ;;
          blackbox)   kubectl -n llm-runtime logs deploy/blackbox-exporter -f ;;
          dcgm)       kubectl -n llm-runtime logs ds/dcgm-exporter -f ;;
        esac

  oco-consumer:deploy:
    desc: Publish llm-runtime dashboard, datasource, and RBAC for OCO Grafana sidecars
    cmds:
      - kubectl apply -k k8s/oco-consumer

  oco-consumer:delete:
    desc: Remove llm-runtime OCO dashboard, datasource, and RBAC contract
    cmds:
      - kubectl delete -k k8s/oco-consumer

  oco-consumer:status:
    desc: Show llm-runtime OCO consumer ConfigMaps and RBAC
    cmds:
      - kubectl -n llm-runtime get configmap -l grafana_datasource=1 -o wide
      - kubectl -n llm-runtime get configmap -l grafana_dashboard=1 -o wide
      - kubectl -n llm-runtime get role,rolebinding observability-console-reader

  oco-consumer:reload:
    desc: Reload OCO Grafana provisioning after llm-runtime consumer changes
    cmds:
      - |
        kubectl exec -n observability-console deployment/grafana -c grafana -- sh -ec '
          curl -fsS -X POST \
            --user "$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD" \
            http://127.0.0.1:3000/api/admin/provisioning/datasources/reload
          printf "\n"
          curl -fsS -X POST \
            --user "$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD" \
            http://127.0.0.1:3000/api/admin/provisioning/dashboards/reload
          printf "\n"
        '
      - task: oco-consumer:check

  oco-consumer:check:
    desc: Verify OCO sidecar, RBAC, provisioning, curated dashboards, and shared llm-runtime metrics
    cmds:
      - |
        set -eu

        kubectl rollout status deployment/grafana -n observability-console --timeout=60s

        for verb in get list watch; do
          allowed="$(kubectl auth can-i "$verb" configmaps \
            -n llm-runtime \
            --as=system:serviceaccount:observability-console:observability-console)"
          if [ "$allowed" != "yes" ]; then
            echo "OCO RBAC check failed: $verb configmaps in llm-runtime -> $allowed" >&2
            exit 1
          fi
        done

        for sidecar in sidecar-datasources sidecar-dashboards; do
          namespaces="$(kubectl get deployment grafana -n observability-console -o json \
            | jq -r --arg sidecar "$sidecar" '.spec.template.spec.containers[] | select(.name == $sidecar) | .env[] | select(.name == "NAMESPACE") | .value')"
          case ",$namespaces," in
            *,llm-runtime,*) ;;
            *)
              echo "OCO $sidecar does not watch llm-runtime: $namespaces" >&2
              exit 1
              ;;
          esac
        done

        kubectl get configmap -n llm-runtime -l grafana_datasource=1 -o name | grep -qx 'configmap/llm-runtime-datasource'
        for cm in \
          ai-runtime-pulse-dashboard \
          ai-runtime-inference-dashboard \
          ai-runtime-agents-memory-dashboard \
          llm-runtime-omniroute-dashboard
        do
          kubectl get configmap "$cm" -n llm-runtime >/dev/null
        done

        for file in \
          ai-runtime-pulse.json \
          ai-runtime-inference.json \
          ai-runtime-agents-memory.json \
          llm-runtime-omniroute.json
        do
          found=0
          for _ in $(seq 1 15); do
            if kubectl exec -n observability-console deployment/grafana -c grafana -- \
              test -f "/var/lib/grafana/dashboards/$file"; then
              found=1
              break
            fi
            sleep 2
          done
          if [ "$found" -ne 1 ]; then
            echo "OCO dashboard sidecar did not materialize $file" >&2
            exit 1
          fi
        done

        kubectl exec -n observability-console deployment/grafana -c grafana -- sh -ec '
          curl -fsS \
            --user "$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD" \
            http://127.0.0.1:3000/api/datasources/uid/victoriametrics >/dev/null
        '

        for uid in ai-runtime-pulse ai-runtime-inference ai-runtime-agents-memory llm-runtime-omniroute; do
          found=0
          for _ in $(seq 1 15); do
            if kubectl exec -n observability-console deployment/grafana -c grafana -- sh -ec \
              "curl -fsS --user \"\$GF_SECURITY_ADMIN_USER:\$GF_SECURITY_ADMIN_PASSWORD\" http://127.0.0.1:3000/api/dashboards/uid/$uid >/dev/null"; then
              found=1
              break
            fi
            sleep 2
          done
          if [ "$found" -ne 1 ]; then
            echo "Grafana did not provision dashboard uid=$uid" >&2
            exit 1
          fi
        done

        vm_payload="$(kubectl exec -n observability-console deployment/grafana -c grafana -- sh -ec '
          curl -fsSG \
            http://victoriametrics.observability-backend.svc.cluster.local:8428/api/v1/query \
            --data-urlencode "query=up{project=\"llm-runtime\"}"
        ')"
        printf '%s\n' "$vm_payload" | jq -e '
          .status == "success" and (.data.result | length) > 0
        ' >/dev/null || {
          echo "shared VictoriaMetrics has no up{project=\"llm-runtime\"} series" >&2
          exit 1
        }

        echo "OK: llm-runtime OCO consumer is provisioned and shared metrics are present"

  observability:targets:
    desc: Show Prometheus scrape targets (JOB=all|vllm|gateway|omniroute, default all)
    vars:
      JOB: '{{.JOB | default "all"}}'
    requires:
      vars:
        - name: JOB
          enum: [all, vllm, gateway, omniroute]
    cmds:
      - |
        case "{{.JOB}}" in
          all)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets | jq .
            ;;
          vllm)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets \
              | jq '.data.activeTargets[] | select(.labels.job | test("^vllm-")) | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'
            ;;
          gateway)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets \
              | jq '.data.activeTargets[] | select(.labels.job == "llm-gateway") | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'
            ;;
          omniroute)
            ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/targets \
              | jq '.data.activeTargets[] | select(.labels.job == "omniroute-blackbox") | {job:.labels.job, health:.health, scrapeUrl:.scrapeUrl, lastError:.lastError}'
            ;;
        esac

  observability:up:
    desc: Query Prometheus availability (JOB=all|vllm|gateway|omniroute, default all)
    vars:
      JOB: '{{.JOB | default "all"}}'
    requires:
      vars:
        - name: JOB
          enum: [all, vllm, gateway, omniroute]
    cmds:
      - |
        case "{{.JOB}}" in
          all)     query='up' ;;
          vllm)    query='up{job=~"vllm-.*"}' ;;
          gateway) query='up{job="llm-gateway"}' ;;
          omniroute) query='probe_success{job="omniroute-blackbox"}' ;;
        esac
        ./scripts/kcurl.sh llm-runtime http://prometheus:9090/api/v1/query \
          --get \
          --data-urlencode "query=${query}" | jq .
