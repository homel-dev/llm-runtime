---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: llm-runtime-mcp
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-runtime-mcp
    app.kubernetes.io/component: mcp-gateway
    app.kubernetes.io/part-of: llm-runtime
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: llm-runtime-mcp
        type: ClusterIP
      envoyDeployment:
        replicas: 1
  shutdown:
    drainTimeout: 90s
    minDrainDuration: 10s
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration_ms: "%DURATION%"
              request_id: "%REQ(X-REQUEST-ID)%"
              upstream_host: "%UPSTREAM_HOST%"
              mcp_method: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp.method.name)%"
              mcp_tool: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp.tool.name)%"
              mcp_provider: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp.provider.name)%"
              mcp_session_id: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp.session.id)%"
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                host: otel-collector.llm-runtime.svc.cluster.local
                port: 4317
                resources:
                  service.name: llm-runtime-mcp
                  service.namespace: llm-runtime
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-collector
            port: 4317
      customTags:
        component:
          type: Literal
          literal:
            value: mcp-gateway
        "k8s.pod.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAME
            defaultValue: "-"
        "k8s.namespace.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAMESPACE
            defaultValue: llm-runtime
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: llm-runtime-mcp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-runtime-mcp
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-runtime-mcp
    app.kubernetes.io/component: mcp-gateway
    app.kubernetes.io/part-of: llm-runtime
spec:
  gatewayClassName: llm-runtime-mcp
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: llm-runtime-mcp
  listeners:
    - name: mcp-http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: llm-runtime-mcp
  namespace: llm-runtime
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-runtime-mcp
  connection:
    bufferLimit: 50Mi
  tcpKeepalive:
    idleTime: 20m
    interval: 60s
    probes: 3
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: memory-steward
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: memory-steward
    app.kubernetes.io/component: mcp-backend
    app.kubernetes.io/part-of: llm-runtime
spec:
  endpoints:
    - fqdn:
        hostname: memory-steward-mcp.ms.svc.cluster.local
        port: 8081
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: memory-steward
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: memory-steward
    app.kubernetes.io/component: mcp-route
    app.kubernetes.io/part-of: llm-runtime
spec:
  parentRefs:
    - name: llm-runtime-mcp
      kind: Gateway
      group: gateway.networking.k8s.io
  path: /mcp
  backendRefs:
    - name: memory-steward
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
      toolSelector:
        includeRegex:
          - '^memory\.retrieve_context$'
