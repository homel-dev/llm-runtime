# Envoy Gateway v1.8.1 values required by Envoy AI Gateway v1.0.0.
# The extension manager is mandatory for MCP because AI Gateway rewrites the
# generated MCP proxy/backend xDS clusters to the in-pod MCP listeners.
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      type: Kubernetes
    extensionApis:
      enableEnvoyPatchPolicy: true
      enableBackend: true
    extensionManager:
      hooks:
        xdsTranslator:
          translation:
            listener:
              includeAll: true
            route:
              includeAll: true
            cluster:
              includeAll: true
            secret:
              includeAll: true
          post:
            - Translation
            - Cluster
            - Route
      service:
        fqdn:
          hostname: ai-gateway-controller.llm-runtime.svc.cluster.local
          port: 1063
