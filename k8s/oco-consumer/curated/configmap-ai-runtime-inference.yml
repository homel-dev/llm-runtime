              "expr": "sum by (tier) (rate(vllm:generation_tokens_total{project=\"llm-runtime\",job=~\"vllm-.*\",tier=~\"$tier\"}[5m]))",
              "refId": "B",
              "legendFormat": "{{tier}} generation"
            }
