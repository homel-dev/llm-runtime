apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-runtime-inference-dashboard
  namespace: llm-runtime
  labels:
    grafana_dashboard: "1"
    observability.homel.dev/dashboard-class: curated
data:
  ai-runtime-inference.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Compact LLM gateway, vLLM, and GPU operating view backed by shared OCO VictoriaMetrics.",
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Gateway up",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(up{project=\"llm-runtime\",job=\"llm-gateway\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Request RPS",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "In flight",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(llm_gateway_requests_in_flight{project=\"llm-runtime\",backend=~\"$backend\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Gateway p95",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_gateway_request_duration_seconds_bucket{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[5m])))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "vLLM running",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_running{project=\"llm-runtime\",job=~\"vllm-.*\",tier=~\"$tier\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "vLLM waiting",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_waiting{project=\"llm-runtime\",job=~\"vllm-.*\",tier=~\"$tier\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests · backend / model / status",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (backend, model, status_code) (rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{backend}} · {{model}} · {{status_code}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Gateway latency · p95",
