            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, tier) (rate(vllm:time_to_first_token_seconds_bucket{project=\"llm-runtime\",job=~\"vllm-.*\",tier=~\"$tier\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{tier}}"
