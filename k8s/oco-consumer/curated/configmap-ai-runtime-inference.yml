            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, backend, model) (rate(llm_gateway_request_duration_seconds_bucket{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{backend}} · {{model}}"
            }
          ]
        },
