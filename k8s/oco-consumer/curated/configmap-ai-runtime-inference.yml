        {
          "id": 14,
          "type": "timeseries",
          "title": "TTFT · p95",
          "gridPos": {
            "x": 8,
            "y": 8,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
