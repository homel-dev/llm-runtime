apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-runtime-pulse-dashboard
  namespace: llm-runtime
  labels:
    grafana_dashboard: "1"
    observability.homel.dev/dashboard-class: curated
data:
  ai-runtime-pulse.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Dense shared-telemetry landing page. Uses only OCO-owned VictoriaMetrics; detailed legacy dashboards remain available for drill-down.",
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Gateway up",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(up{project=\"llm-runtime\",job=\"llm-gateway\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Gateway RPS",
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "In flight",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(llm_gateway_requests_in_flight{project=\"llm-runtime\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "5xx + transport/s",
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "(sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",status_code=~\"5..\"}[5m])) or vector(0)) + (sum(rate(llm_gateway_upstream_errors_total{project=\"llm-runtime\"}[5m])) or vector(0))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "MCP RPS",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(envoy_http_downstream_rq_total{project=\"llm-runtime\",job=\"mcp-envoy\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "vLLM running",
          "gridPos": {
            "x": 15,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_running{project=\"llm-runtime\",job=~\"vllm-.*\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "vLLM waiting",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_waiting{project=\"llm-runtime\",job=~\"vllm-.*\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "GPU max util",
          "gridPos": {
            "x": 21,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(DCGM_FI_DEV_GPU_UTIL{project=\"llm-runtime\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Gateway traffic · backend / model / status",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (backend, model, status_code) (rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{backend}} · {{model}} · {{status_code}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Gateway latency · p95",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, backend, model) (rate(llm_gateway_request_duration_seconds_bucket{project=\"llm-runtime\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{backend}} · {{model}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "GPU utilization",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL{project=\"llm-runtime\"}",
              "refId": "A",
              "legendFormat": "GPU {{gpu}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Request path activity",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\"}[5m]))",
              "refId": "A",
              "legendFormat": "LLM gateway"
            },
            {
              "expr": "sum(rate(envoy_http_downstream_rq_total{project=\"llm-runtime\",job=\"mcp-envoy\"}[5m]))",
              "refId": "B",
              "legendFormat": "MCP gateway"
            },
            {
              "expr": "sum(rate(memory_steward_router_requests_total{project=\"memory-steward\"}[5m]))",
              "refId": "C",
              "legendFormat": "Memory router"
            },
            {
              "expr": "sum(rate(memory_steward_mcp_tool_calls_total{project=\"memory-steward\"}[5m]))",
              "refId": "D",
              "legendFormat": "MS MCP tools"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "ai-runtime",
        "curated",
        "overview"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "AI Runtime · Pulse",
      "uid": "ai-runtime-pulse",
      "version": 1
    }
