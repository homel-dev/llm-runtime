apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-runtime-omniroute-dashboard
  namespace: llm-runtime
  labels:
    grafana_dashboard: "1"
data:
  llm-runtime-omniroute.json: |
    {
      "uid": "llm-runtime-omniroute",
      "title": "LLM Runtime \u00b7 OmniRoute",
      "tags": [
        "llm-runtime",
        "omniroute",
        "gateway"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Endpoint",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "max(probe_success{job=\"omniroute-blackbox\"}) or vector(0)",
              "refId": "A",
              "legendFormat": ""
            }
          ],
          "description": "Blackbox probe of the parallel OmniRoute OpenAI-compatible Service.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / s",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(omniroute_calls_total[5m])) or vector(0)",
              "refId": "A",
              "legendFormat": ""
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failures / s",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(omniroute_calls_total{omniroute_routing_outcome!=\"success\"}[5m])) or vector(0)",
              "refId": "A",
              "legendFormat": ""
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Fallbacks / s",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(omniroute_calls_total{omniroute_routing_fallback_used=\"1\"}[5m])) or vector(0)",
              "refId": "A",
              "legendFormat": ""
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Latency p95",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(omniroute_duration_seconds_bucket[5m]))) or vector(0)",
              "refId": "A",
              "legendFormat": ""
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Probe duration",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "max(probe_duration_seconds{job=\"omniroute-blackbox\"}) or vector(0)",
              "refId": "A",
              "legendFormat": ""
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Request rate by provider / model",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_provider_name, gen_ai_request_model) (rate(omniroute_calls_total[5m]))",
              "refId": "A",
              "legendFormat": "{{gen_ai_provider_name}} / {{gen_ai_request_model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Outcomes",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "sum by (omniroute_routing_outcome) (rate(omniroute_calls_total[5m]))",
              "refId": "A",
              "legendFormat": "{{omniroute_routing_outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Request latency",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(omniroute_duration_seconds_bucket[5m])))",
              "refId": "A",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(omniroute_duration_seconds_bucket[5m])))",
              "refId": "B",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(omniroute_duration_seconds_bucket[5m])))",
              "refId": "C",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "HTTP status from routed upstream",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "llm-runtime-prometheus"
          },
          "targets": [
            {
              "expr": "sum by (omniroute_routing_status) (rate(omniroute_calls_total[5m]))",
              "refId": "A",
              "legendFormat": "HTTP {{omniroute_routing_status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "OmniRoute pod logs",
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "{service=\"omniroute\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 12,
          "type": "traces",
          "title": "OmniRoute routing traces",
          "gridPos": {
            "x": 12,
            "y": 17,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "queryType": "traceql",
              "query": "{ resource.service.name = `llm-runtime-omniroute` }",
              "refId": "A"
            }
          ]
        }
      ]
    }
