apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-runtime-gateway-dashboard
  namespace: llm-runtime
  labels:
    grafana_dashboard: "1"
data:
  llm-runtime-gateway.json: |
    {
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Gateway scrape up",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "up{job=\"llm-gateway\"}", "refId": "A"}],
          "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "value", "graphMode": "none", "justifyMode": "auto"}
        },
        {
          "type": "stat",
          "title": "In flight",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "sum(llm_gateway_requests_in_flight)", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}
        },
        {
          "type": "stat",
          "title": "5xx rate",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "sum(rate(llm_gateway_upstream_requests_total{status_code=~\"5..\"}[5m])) + sum(rate(llm_gateway_upstream_errors_total[5m]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}
        },
        {
          "type": "stat",
          "title": "Gemini last success age",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "time() - max(llm_gateway_backend_last_success_timestamp_seconds{backend=\"gemini-subscription\"})", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}
        },
        {
          "type": "stat",
          "title": "OpenAI subscription last success age",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "time() - max(llm_gateway_backend_last_success_timestamp_seconds{backend=\"subscription\"})", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}
        },
        {
          "type": "timeseries",
          "title": "Request rate by backend/model/status",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "sum by (backend, model, status_code) (rate(llm_gateway_upstream_requests_total[5m]))", "legendFormat": "{{backend}} / {{model}} / {{status_code}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "p95 latency by backend/model",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, backend, model) (rate(llm_gateway_request_duration_seconds_bucket[5m])))", "legendFormat": "{{backend}} / {{model}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Transport errors/timeouts",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "sum by (backend, model, reason) (rate(llm_gateway_upstream_errors_total[5m]))", "legendFormat": "{{backend}} / {{model}} / {{reason}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Gateway traffic bytes/sec",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [
            {"expr": "sum by (backend, model) (rate(llm_gateway_request_bytes_total[5m]))", "legendFormat": "request {{backend}} / {{model}}", "refId": "A"},
            {"expr": "sum by (backend, model) (rate(llm_gateway_response_bytes_total[5m]))", "legendFormat": "response {{backend}} / {{model}}", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Locally rejected requests",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "sum by (reason, status_code) (rate(llm_gateway_rejected_requests_total[5m]))", "legendFormat": "{{reason}} / {{status_code}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Gateway process RSS",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "datasource": {"type": "prometheus", "uid": "llm-runtime-prometheus"},
          "targets": [{"expr": "llm_gateway_process_resident_memory_bytes", "legendFormat": "RSS", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["llm-runtime", "gateway", "subscriptions"],
      "time": {"from": "now-30m", "to": "now"},
      "timezone": "browser",
      "title": "LLM Runtime Gateway",
      "uid": "llm-runtime-gateway",
      "version": 1
    }
