# k8s/oco-consumer/rolebinding.yml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-console-reader
  namespace: llm-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-console-reader
subjects:
  - kind: ServiceAccount
    name: observability-console
    namespace: observability-console
