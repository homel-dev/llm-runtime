apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmrun-tempo-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {protocol: TCP, port: 4318}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-console
      ports:
        - {protocol: TCP, port: 3200}
