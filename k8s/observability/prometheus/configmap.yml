# k8s/observability/prometheus/configmap.yml
apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics

data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - prometheus.llm-runtime.svc.cluster.local:9090

      - job_name: vllm-small
        metrics_path: /metrics
        static_configs:
          - targets:
              - llm-small.llm-runtime.svc.cluster.local:8000
            labels:
              subsystem: llm-runtime
              tier: small

      - job_name: vllm-large
        metrics_path: /metrics
        static_configs:
          - targets:
              - llm-large.llm-runtime.svc.cluster.local:8000
            labels:
              subsystem: llm-runtime
              tier: large


      - job_name: llm-gateway
        metrics_path: /metrics
        static_configs:
          - targets:
              - llm-openai-api-gateway.llm-runtime.svc.cluster.local:9091
            labels:
              subsystem: llm-runtime
              component: gateway

      - job_name: mcp-envoy
        metrics_path: /stats/prometheus
        static_configs:
          - targets:
              - llm-runtime-mcp-metrics.llm-runtime.svc.cluster.local:19001
            labels:
              subsystem: llm-runtime
              component: mcp-gateway

      - job_name: otel-collector
        metrics_path: /metrics
        static_configs:
          - targets:
              - otel-collector.llm-runtime.svc.cluster.local:8888
            labels:
              subsystem: llm-runtime
              component: telemetry

      - job_name: otel-runtime-metrics
        metrics_path: /metrics
        static_configs:
          - targets:
              - otel-collector.llm-runtime.svc.cluster.local:8889
            labels:
              subsystem: llm-runtime
              component: runtime-telemetry

      - job_name: dcgm-exporter
        metrics_path: /metrics
        static_configs:
          - targets:
              - dcgm-exporter.llm-runtime.svc.cluster.local:9400
            labels:
              subsystem: gpu

