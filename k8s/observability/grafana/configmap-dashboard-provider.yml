# k8s/observability/grafana/configmap-dashboard-provider.yml
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider

  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard

data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: llm-runtime
        orgId: 1
        folder: LLM Runtime
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
