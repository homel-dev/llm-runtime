# k8s/observability/grafana/service.yml
apiVersion: v1
kind: Service

metadata:
  name: grafana

  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard

spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana

  ports:
    - name: http
      port: 3000
      nodePort: 30300
      targetPort: 3000
