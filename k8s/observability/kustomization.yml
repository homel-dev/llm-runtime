# k8s/observability/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-runtime

resources:

  - prometheus/configmap.yml
  - prometheus/deployment.yml
  - prometheus/service.yml

  - tempo/config.yaml
  - tempo/storage.yaml
  - tempo/tempo.yaml
  - tempo/networkpolicy.yaml

  - loki/configmap.yml
  - loki/deployment.yml
  - loki/service.yml
  - loki/networkpolicy.yaml

  - otel-collector/config.yaml
  - otel-collector/collector.yaml
  - otel-collector/networkpolicy.yaml

  - exporters/dcgm/daemonset.yml
  - exporters/dcgm/service.yml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: llm-runtime-metrics
