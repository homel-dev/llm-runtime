# k8s/observability/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-runtime

resources:

  - prometheus/configmap.yml
  - prometheus/deployment.yml
  - prometheus/service.yml

  - tempo/configmap.yml
  - tempo/deployment.yml
  - tempo/service.yml

  - loki/configmap.yml
  - loki/deployment.yml
  - loki/service.yml

  - otel-collector/configmap.yml
  - otel-collector/deployment.yml
  - otel-collector/service.yml

  - exporters/dcgm/daemonset.yml
  - exporters/dcgm/service.yml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: llm-runtime-metrics
