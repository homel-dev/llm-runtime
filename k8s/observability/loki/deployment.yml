apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: logs
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.7
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /var/loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: llm-runtime
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
