apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 384
      batch: {}
      resource:
        attributes:
          - key: deployment.environment.name
            value: llm-runtime
            action: upsert
    exporters:
      otlp/tempo:
        endpoint: tempo.llm-runtime.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki.llm-runtime.svc.cluster.local:3100/otlp
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
