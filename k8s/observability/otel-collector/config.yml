apiVersion: v1
kind: ConfigMap
metadata:
  name: llmrun-otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 384
        spike_limit_mib: 64
      resource:
        attributes:
          - key: deployment.environment.name
            value: llm-runtime
            action: upsert
      batch: {}

    exporters:
      prometheus/runtime:
        endpoint: "0.0.0.0:8889"
      otlphttp/tempo:
        endpoint: "http://tempo.llm-runtime.svc.cluster.local:4318"
      otlphttp/loki:
        endpoint: "http://loki.llm-runtime.svc.cluster.local:3100/otlp"

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus/runtime]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
