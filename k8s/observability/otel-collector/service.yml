apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http, appProtocol: http }
    - { name: metrics, port: 8888, targetPort: metrics }
