# k8s/observability/exporters/dcgm/daemonset.yml
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: dcgm-exporter

  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/component: gpu-metrics

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter

  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/component: gpu-metrics

    spec:
      tolerations:
        - operator: Exists

      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
          imagePullPolicy: IfNotPresent

          env:
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"

          securityContext:
            privileged: true

          ports:
            - name: metrics
              containerPort: 9400

          readinessProbe:
            httpGet:
              path: /metrics
              port: 9400
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
