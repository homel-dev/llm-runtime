apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: telemetry
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
          fail_if_not_ssl: false
