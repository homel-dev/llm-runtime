# Trusted RR runner needs read-only Service discovery in llm-runtime so it can
# materialize hostAliases for hostile jobs that intentionally run without DNS.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rr-pi-llm-service-reader
  namespace: llm-runtime
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rr-pi-llm-service-reader
  namespace: llm-runtime
subjects:
  - kind: ServiceAccount
    name: rr-pi-runner
    namespace: rr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rr-pi-llm-service-reader
