# Temporary operator-only helper. Do not leave running after login.
apiVersion: v1
kind: Pod
metadata:
  name: llm-openai-subscription-login
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-openai-subscription-login
    app.kubernetes.io/component: gateway-auth
    app.kubernetes.io/part-of: llm-runtime
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  imagePullSecrets:
    - name: ghcr-pull-secret
  containers:
    - name: login
      image: ghcr.io/homel-dev/llm-runtime-gateway:main
      imagePullPolicy: IfNotPresent
      command: [sleep, infinity]
      env:
        - { name: HOME, value: /auth/home }
        - { name: CODEX_HOME, value: /auth }
        - { name: npm_config_cache, value: /tmp/npm-cache }
      ports:
        - { containerPort: 1455 }
      volumeMounts:
        - { name: subscription-auth, mountPath: /auth }
        - { name: subscription-tmp, mountPath: /tmp }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: [ALL]
  volumes:
    - name: subscription-auth
      persistentVolumeClaim:
        claimName: rr-openai-subscription-auth
    - name: subscription-tmp
      emptyDir: {}
