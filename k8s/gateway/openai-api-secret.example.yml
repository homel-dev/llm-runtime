# EXAMPLE ONLY. Do not commit a real provider key.
# Create out-of-band when the API-key backend is intentionally enabled:
#   kubectl -n llm-runtime create secret generic llm-openai-api-gateway \
#     --from-literal=api-key="$OPENAI_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: llm-openai-api-gateway
  namespace: llm-runtime
type: Opaque
stringData:
  api-key: "REPLACE_WITH_OPENAI_API_KEY"
