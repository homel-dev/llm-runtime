# k8s/large/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-large
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-large
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: large

spec:
  replicas: 1
  # Singleton GPU workload consumes three GPUs; a surge rollout cannot schedule
  # beside the current Pod. Delete the old Pod before creating the new one.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-large

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-large
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: large

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0-cu130
          imagePullPolicy: IfNotPresent

          args:
            - Qwen/Qwen2.5-72B-Instruct-AWQ
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - Qwen2.5-72B-Instruct-AWQ
            - --quantization
            - awq
            - --dtype
            - float16
            - --tensor-parallel-size
            - "1"
            - --pipeline-parallel-size
            - "3"
            - --hf-overrides
            - '{"rope_parameters":{"factor":2.0,"original_max_position_embeddings":32768,"rope_theta":1000000,"rope_type":"yarn"}}'
            - --max-model-len
            - "65536"
            - --gpu-memory-utilization
            - "0.92"
            - --max-num-seqs
            - "4"
            - --enforce-eager
            - --no-async-scheduling
            - --structured-outputs-config.backend
            - xgrammar

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180

          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "3"
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "3"

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-large

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
