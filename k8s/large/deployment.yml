# k8s/large/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-large
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-large
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: large

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-large

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-large
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: large

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          args:
            - Qwen/Qwen2.5-32B-Instruct-AWQ

            - --host
            - "0.0.0.0"

            - --port
            - "8000"

            - --max-model-len
            - "4096"

            - --gpu-memory-utilization
            - "0.95"

            - --max-num-seqs
            - "2"

            - --enforce-eager

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

            # Physical host GPU2:
            # NVIDIA-SMI index 2 / bus 00000000:82:00.0
            - name: NVIDIA_VISIBLE_DEVICES
              value: GPU-0483e19d-6321-b657-1ed6-b262f2789541

            # Inside the container, that single visible GPU becomes CUDA 0.
            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120

          resources:
            requests:
              cpu: "6"
              memory: 24Gi
            limits:
              cpu: "12"
              memory: 48Gi

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-large

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
