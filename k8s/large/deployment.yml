# k8s/large/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-large
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-large
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: large

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-large

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-large
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: large

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          args:
            - casperhansen/deepseek-r1-distill-qwen-32b-awq
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --tensor-parallel-size
            - "2"
            - --quantization
            - awq
            - --max-model-len
            - "120000"
            - --gpu-memory-utilization
            - "0.92"
            - --max-num-seqs
            - "1"
            - --enforce-eager

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: NVIDIA_VISIBLE_DEVICES
              value: GPU-0483e19d-6321-b657-1ed6-b262f2789541,GPU-06c039b0-1d69-52eb-2475-45c1dad81aea

            - name: CUDA_VISIBLE_DEVICES
              value: "0,1"

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180

          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "2"

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-large

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
