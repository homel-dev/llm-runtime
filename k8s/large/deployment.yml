apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-large
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-large
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: large

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-large

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-large
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: large

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent

          args:
            - Qwen/Qwen3-32B-AWQ

            - --host
            - "0.0.0.0"

            - --port
            - "8000"

            - --served-model-name
            - Qwen3-32B-AWQ

            - --quantization
            - awq

            - --tensor-parallel-size
            - "2"

            - --gpu-memory-utilization
            - "0.92"

            - --pipeline-parallel-size
            - "1"
            - --disable-custom-all-reduce
            - --enforce-eager

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

            # Pin CUDA/vLLM to the two known-good physical RTX 3090s.
            #
            # 01:00.0 = GPU-06c039b0-1d69-52eb-2475-45c1dad81aea
            # 81:00.0 = GPU-0de7cad3-de92-f02d-31b1-c0400359ef20
            #
            # Explicitly excludes:
            # 82:00.0 = GPU-0483e19d-6321-b657-1ed6-b262f2789541
            - name: CUDA_VISIBLE_DEVICES
              value: "GPU-06c039b0-1d69-52eb-2475-45c1dad81aea,GPU-0de7cad3-de92-f02d-31b1-c0400359ef20"
            - name: CUDA_DEVICE_ORDER
              value: PCI_BUS_ID

            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180

          resources:
            requests:
              cpu: "2"
              memory: 16Gi

              # Deliberately reserve all three physical GPUs.
              # The CUDA process itself is restricted to the two
              # known-good UUIDs above.
              nvidia.com/gpu: "3"

            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "3"

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-large

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

