# k8s/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-runtime

resources:
  - namespace.yml

  - runtime-contract.yml
  - networkpolicy.yml

  - small/pvc.yml
  - small/deployment.yml
  - small/service.yml

  - medium/pvc.yml
  - medium/deployment.yml
  - medium/service.yml

  - large/pvc.yml
  - large/deployment.yml
  - large/service.yml

commonLabels:
  app.kubernetes.io/part-of: llm-runtime
