# k8s/small/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-small
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-small
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: small

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-small

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-small
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: small

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          args:
            - Qwen/Qwen2.5-3B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --device
            - cpu
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "4"
            - --enforce-eager

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: VLLM_TARGET_DEVICE
              value: cpu

            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90

          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "12"
              memory: 32Gi

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-small
