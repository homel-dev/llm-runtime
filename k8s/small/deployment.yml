# k8s/small/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-small
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-small
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: small

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-small

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-small
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: small

    spec:
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server
          imagePullPolicy: IfNotPresent

          args:
            - -hf
            - Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
            - --alias
            - Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --ctx-size
            - "32768"
            - --parallel
            - "1"
            - --threads
            - "12"
            - --threads-batch
            - "12"
            - --metrics

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120

          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "16"
              memory: 32Gi

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-small
