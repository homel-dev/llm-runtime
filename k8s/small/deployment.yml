# k8s/small/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-small
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-small
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: small

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-small

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-small
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: small

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          args:
            - Qwen/Qwen2.5-7B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.85"
            - --max-num-seqs
            - "8"
            - --enforce-eager

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

            - name: NVIDIA_VISIBLE_DEVICES
              value: GPU-06c039b0-1d69-52eb-2475-45c1dad81aea

            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-small
