# Flux reconciles this Job on each aliases.json revision without restarting OmniRoute.
# Store GitOps ownership state on a small persistent volume. The Kubernetes API
# was unreachable from this restricted Job, so it must not be a runtime dependency.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniroute-rr-alias-state
  namespace: llm-runtime
  annotations:
    kustomize.toolkit.fluxcd.io/prune: Disabled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
# Allow the one-shot Job to reach the OmniRoute API even when the namespace
# has a default-deny egress policy. No Kubernetes API access is required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-alias-sync-egress
  namespace: llm-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omniroute-alias-sync
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omniroute
      ports:
        - { protocol: TCP, port: 20128 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: omniroute-alias-sync
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: omniroute-alias-sync
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 8
  activeDeadlineSeconds: 800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniroute-alias-sync
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/library/node:22.16.0-alpine3.22
          imagePullPolicy: IfNotPresent
          command: [node, /sync/alias-reconcile.mjs]
          env:
            - name: OR_BASE_URL
              value: http://omniroute.llm-runtime.svc.cluster.local:20128
            - name: OR_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omniroute-operator-token
                  key: token
          volumeMounts:
            - name: aliases
              mountPath: /sync
              readOnly: true
            - name: ownership-state
              mountPath: /state
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: aliases
          configMap:
            name: omniroute-rr-alias-config
        - name: ownership-state
          persistentVolumeClaim:
            claimName: omniroute-rr-alias-state
