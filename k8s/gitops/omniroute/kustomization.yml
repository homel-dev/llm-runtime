apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-runtime
resources:
  - ../../omniroute
  - bootstrap.yml
  - alias-sync.yml
configMapGenerator:
  - name: omniroute-bootstrap-script
    options:
      disableNameSuffixHash: true
    files:
      - bootstrap.py
  - name: omniroute-startup-script
    files:
      - startup.sh
      - manage.mjs
      - manage-wrapper.mjs
  - name: omniroute-rr-alias-config
    files:
      - aliases.json
      - alias-reconcile.mjs
# Keep the existing native provider startup but delegate all routing aliases to
# the declarative Flux Job. JSON changes affect only the Job pod template.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: omniroute
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omniroute
      spec:
        template:
          spec:
            containers:
              - name: omniroute
                env:
                  - name: OR_MANAGE_SCRIPT
                    value: /etc/omniroute-startup/manage-wrapper.mjs
generatorOptions:
  disableNameSuffixHash: false
images:
  - name: omniroute
    newName: docker.io/diegosouzapw/omniroute
    newTag: next
