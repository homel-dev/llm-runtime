apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do not use top-level namespace: Roles and RoleBindings also target rr.
resources:
  - ../../omniroute
  - bootstrap.yml
  - fresh-pvc.yml
  - operator-token-bootstrap.yml
  - credential-mirror.yml
configMapGenerator:
  - name: omniroute-bootstrap-script
    namespace: llm-runtime
    options:
      disableNameSuffixHash: true
    files:
      - bootstrap.py
  - name: omniroute-token-bootstrap-script
    namespace: llm-runtime
    files:
      - operator-token-bootstrap.sh
  - name: omniroute-credential-mirror-script
    namespace: llm-runtime
    files:
      - credential-mirror.py
patches:
  - path: clean-deployment.yml
  - target:
      kind: NetworkPolicy
      name: omniroute
      namespace: llm-runtime
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: rr
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: rr-omniroute-api-key-bootstrap
          ports:
            - protocol: TCP
              port: 20128
images:
  - name: omniroute
    newName: docker.io/diegosouzapw/omniroute
    newTag: 3.8.53
