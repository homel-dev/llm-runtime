apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-runtime
resources:
  - ../../omniroute
  - bootstrap.yml
configMapGenerator:
  - name: omniroute-bootstrap-script
    options:
      disableNameSuffixHash: true
    files:
      - bootstrap.py
  - name: omniroute-startup-script
    files:
      - startup.sh
      - manage.mjs
generatorOptions:
  disableNameSuffixHash: false
images:
  - name: omniroute
    newName: ghcr.io/homel-dev/llm-runtime-omniroute
    newTag: main
