# Required because Kubernetes cannot mount Secrets or PVCs across namespaces.
# This controller transports only the four approved credentials into rr.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omniroute-credential-mirror
  namespace: llm-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omniroute-credential-mirror-read
  namespace: llm-runtime
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [rr-zai-coding, rr-opencode-zen]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omniroute-credential-mirror-read
  namespace: llm-runtime
subjects:
  - kind: ServiceAccount
    name: omniroute-credential-mirror
    namespace: llm-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omniroute-credential-mirror-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omniroute-credential-mirror-write
  namespace: rr
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [rr-omniroute-codex, rr-omniroute-agy, rr-omniroute-glm, rr-omniroute-opencode]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omniroute-credential-mirror-write
  namespace: rr
subjects:
  - kind: ServiceAccount
    name: omniroute-credential-mirror
    namespace: llm-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omniroute-credential-mirror-write
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute-credential-mirror
  namespace: llm-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omniroute-credential-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniroute-credential-mirror
    spec:
      serviceAccountName: omniroute-credential-mirror
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mirror
          image: docker.io/library/python:3.12.12-alpine3.22
          command: [python, /config/credential-mirror.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - { name: script, mountPath: /config, readOnly: true }
            - { name: codex, mountPath: /codex-auth, readOnly: true }
            - { name: agy, mountPath: /agy-auth, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: script
          configMap: {name: omniroute-credential-mirror-script}
        - name: codex
          persistentVolumeClaim: {claimName: rr-openai-subscription-auth, readOnly: true}
        - name: agy
          persistentVolumeClaim: {claimName: rr-gemini-subscription-auth, readOnly: true}
