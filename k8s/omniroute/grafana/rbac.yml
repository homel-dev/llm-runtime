apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oco-grafana-llm-runtime-dashboard-reader
  namespace: llm-runtime
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oco-grafana-llm-runtime-dashboard-reader
  namespace: llm-runtime
subjects:
  - kind: ServiceAccount
    name: observability-console
    namespace: observability-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oco-grafana-llm-runtime-dashboard-reader
