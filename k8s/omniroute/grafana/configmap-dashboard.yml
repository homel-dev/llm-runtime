apiVersion: v1
kind: ConfigMap
metadata:
  name: omniroute-grafana-dashboard
  namespace: llm-runtime
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: llm-runtime
data:
  llm-runtime-omniroute-providers.json: |
    {
      "uid": "llm-runtime-omniroute-providers",
      "title": "LLM Runtime / OmniRoute Routing & Activity",
      "description": "Live Combo routing, alias mappings, provider and model activity, and recent calls from OmniRoute REST plus OCO liveness.",
      "schemaVersion": 39,
      "version": 2,
      "id": null,
      "tags": [
        "llm-runtime",
        "omniroute",
        "routing",
        "combos",
        "observability"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "editable": false,
      "graphTooltip": 1,
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "OmniRoute HTTP",
          "description": "Service liveness, not provider inference health. Probe from llm-runtime Alloy to OmniRoute compatibility Service.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(probe_success{project=\"llm-runtime\",job=\"omniroute-blackbox\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Combos",
          "description": "Live number of configured OmniRoute Combos; first party management API.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/combos?limit=100&offset=0",
              "url_options": {
                "method": "GET"
              },
              "parser": "jq-backend",
              "root_selector": ". | [{value:(.total // 0)}] | .[]",
              "columns": [
                {
                  "selector": "value",
                  "text": "Value",
                  "type": "number"
                }
              ]
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
