              "root_selector": ".combos[] | {name:.name, strategy:.strategy, members:(.models // [] | length), targets:(.models // [] | map(if type == \"string\" then . elif .kind == \"combo-ref\" then (\"combo/\" + (.comboName // \"?\")) elif .kind == \"provider-wildcard\" then ((.providerId // \"?\") + \"/\" + (.modelPattern // \"*\")) else (.model // \"?\") end) | join(\" -> \")), context:.computed_context_length, id:.id}",
              "columns": [
                {
                  "selector": "name",
