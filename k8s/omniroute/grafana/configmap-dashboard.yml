        {
          "id": 10,
          "type": "table",
          "title": "Routing: alias / role → Combo → targets",
          "description": "Live OmniRoute model-to-Combo mappings joined by Combo ID to configured Combos. Outer join retains missing/unmatched references. First 100 of each.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/model-combo-mappings?limit=100&offset=0",
              "url_options": {
                "method": "GET"
              },
              "parser": "jq-backend",
              "root_selector": ".mappings[] | {alias:.pattern, join_id:.comboId, enabled:.enabled, priority:.priority}",
              "columns": [
                {
                  "selector": "alias",
                  "text": "Alias / pattern",
                  "type": "string"
                },
                {
                  "selector": "join_id",
                  "text": "Combo ID",
                  "type": "string"
                },
                {
                  "selector": "enabled",
                  "text": "Enabled",
                  "type": "boolean"
                },
                {
                  "selector": "priority",
                  "text": "Priority",
                  "type": "number"
                }
              ]
            },
            {
              "refId": "B",
              "type": "json",
              "format": "table",
              "source": "url",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/combos?limit=100&offset=0",
              "url_options": {
                "method": "GET"
              },
              "parser": "jq-backend",
              "root_selector": ".combos[] | {join_id:.id, combo:.name, strategy:.strategy, targets:(.models // [] | map(if type == \"string\" then . elif .kind == \"combo-ref\" then (\"combo/\" + (.comboName // \"?\")) elif .kind == \"provider-wildcard\" then ((.providerId // \"?\") + \"/\" + (.modelPattern // \"*\")) else (.model // \"?\") end) | join(\" -> \"))}",
              "columns": [
                {
                  "selector": "join_id",
                  "text": "Combo ID",
                  "type": "string"
                },
                {
                  "selector": "combo",
                  "text": "Combo",
                  "type": "string"
                },
                {
                  "selector": "strategy",
                  "text": "Strategy",
                  "type": "string"
                },
                {
                  "selector": "targets",
                  "text": "Targets (ordered)",
                  "type": "string"
                }
              ]
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "Combo ID",
                "mode": "outerTabular"
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Combos: definition and ordered targets",
          "description": "Live Combo definitions (up to 100), including empty Combos and nested references; member ordering is meaningful for priority routing.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 14,
            "h": 12
          },
