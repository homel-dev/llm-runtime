        {
          "id": 3,
          "type": "text",
          "title": "Data scope & interpretation",
          "gridPos": {
            "x": 0,
            "y": 102,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Live routing** comes from OmniRoute Combos and model-to-Combo mappings. These are runtime objects, not the GitOps desired-state file. The routing tables list up to 100 records per collection. **Direct aliases** and **Settings aliases** are displayed separately; they are not Combo routes. \n\n**Last 100 requests** is a fixed sample, independent of Grafana's time picker. The latency plot and recent errors also use this sample. **Provider health** and its request counter always cover the API's fixed 24h window. **Historical calls** and provider/model totals cover retained records, not the selected time interval. **Combo activity** is in-memory per-process telemetry and can reset on restart; it is not a 24h historical total. \n\n**HTTP probe:** OCO VictoriaMetrics. **All other panels:** OmniRoute native read-only REST API through Grafana Infinity. No inference probes, pricing requests, or mutation calls are generated by this dashboard."
          }
        },
