apiVersion: v1
kind: ConfigMap
metadata:
  name: omniroute-grafana-admiral-dashboard
  namespace: llm-runtime
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: llm-runtime
data:
  llm-runtime-omniroute-admiral.json: |
    {
      "uid": "llm-runtime-omniroute-admiral",
      "title": "LLM Runtime / OmniRoute · Provider & Model Distribution",
      "description": "Provider-wide lifetime counts, latency and token volume; mapped aliases resolved by Combo UUID. Per-alias final model success/failure and recorded total tokens over 30 days. Configured leaf models visible at zero usage; intermediate Combos omitted. Alias panel time range fixed to 30d.",
      "schemaVersion": 39,
      "version": 4,
      "id": null,
      "tags": [
        "llm-runtime",
        "omniroute",
        "routing",
        "providers",
        "outcomes"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "hidden": true
      },
      "editable": false,
      "graphTooltip": 0,
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "alias",
            "label": "Route alias",
            "type": "query",
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "refresh": 1,
            "sort": 1,
            "skipUrlSync": false,
            "regex": "",
            "datasource": {
              "type": "yesoreyeram-infinity-datasource",
              "uid": "omniroute-api"
            },
            "definition": "Infinity: enabled model-combo mappings (alias label, stable combo UUID value)",
            "query": {
              "queryType": "infinity",
              "query": "",
              "infinityQuery": {
                "refId": "variable",
                "type": "json",
                "format": "table",
                "source": "url",
                "parser": "jq-backend",
                "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/model-combo-mappings?limit=200&offset=0",
                "url_options": {
                  "method": "GET"
                },
                "root_selector": ".mappings[] | select(.enabled != false and (.pattern | type == \"string\") and (.comboId | type == \"string\")) | {__text: .pattern, __value: .comboId}",
                "columns": [
                  {
                    "selector": "__text",
                    "text": "__text",
                    "type": "string"
                  },
                  {
                    "selector": "__value",
                    "text": "__value",
                    "type": "string"
                  }
                ]
              }
            },
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "barchart",
          "title": "Providers · successful vs failed",
          "description": "Lifetime counts from OmniRoute call_logs, grouped by actual provider. Failed includes all requests not counted as HTTP 2xx/3xx success.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 11
          },
          "targets": [
            {
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "omniroute-api"
              },
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "parser": "jq-backend",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/provider-stats",
              "url_options": {
                "method": "GET"
              },
              "root_selector": ".providers[] | select((.totalRequests // 0) > 0) | {provider:.provider, success:(.successfulRequests // 0), failed:((.totalRequests // 0)-(.successfulRequests // 0))}",
              "columns": [
                {
                  "selector": "provider",
                  "text": "Provider",
                  "type": "string"
                },
                {
                  "selector": "success",
                  "text": "Successful",
                  "type": "number"
                },
                {
                  "selector": "failed",
                  "text": "Failed / other",
                  "type": "number"
                }
              ]
            }
          ],
          "options": {
            "orientation": "horizontal",
            "xField": "provider",
            "stacking": "normal",
            "showValue": "auto",
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "barRadius": 0,
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0,
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Successful"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed / other"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 2,
          "type": "barchart",
          "title": "Providers · average latency",
          "description": "Lifetime mean latency in milliseconds, across recorded provider requests; not p95.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "omniroute-api"
              },
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "parser": "jq-backend",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/provider-stats",
              "url_options": {
                "method": "GET"
              },
              "root_selector": ".providers[] | select(.avgLatencyMs != null) | {provider:.provider, latency:.avgLatencyMs}",
              "columns": [
                {
                  "selector": "provider",
                  "text": "Provider",
                  "type": "string"
                },
                {
                  "selector": "latency",
                  "text": "Average latency (ms)",
                  "type": "number"
                }
              ]
            }
          ],
          "options": {
            "orientation": "horizontal",
            "xField": "provider",
            "stacking": "none",
            "showValue": "auto",
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "barRadius": 0,
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0,
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "barchart",
          "title": "Providers · token volume",
          "description": "Lifetime input/output tokens from OmniRoute call_logs; attribution to final provider.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "omniroute-api"
              },
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "parser": "jq-backend",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/provider-stats",
              "url_options": {
                "method": "GET"
              },
              "root_selector": ".providers[] | select((.totalRequests // 0) > 0) | {provider:.provider, input:(.totalTokensIn // 0), output:(.totalTokensOut // 0)}",
              "columns": [
                {
                  "selector": "provider",
                  "text": "Provider",
                  "type": "string"
                },
                {
                  "selector": "input",
                  "text": "Input",
                  "type": "number"
                },
                {
                  "selector": "output",
                  "text": "Output",
                  "type": "number"
                }
              ]
            }
          ],
          "options": {
            "orientation": "horizontal",
            "xField": "provider",
            "stacking": "normal",
            "showValue": "auto",
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "barRadius": 0,
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0,
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "barchart",
          "title": "${alias:text} · final models · successful / failed (30d)",
          "description": "Final leaf models for the mapped Combo (including configured models with zero calls). Counts in the last 30d; successful/failed split estimated from per-target successRate (rounded by OmniRoute). Includes nested Combo targets. Not tied to Grafana time picker.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "omniroute-api"
              },
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "parser": "jq-backend",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/usage/combo-health?range=30d&comboId=${alias:raw}",
              "url_options": {
                "method": "GET"
              },
              "root_selector": "[.combos[].targetHealth[]? | select(.model != null and .model != \"\") | {model: .model, requests: (.requests // 0), success: (((.requests // 0) * (.successRate // 0) / 100) | round)}] | group_by(.model) | map({model: .[0].model, success: (map(.success) | add // 0), failure: (map(.requests - .success) | add // 0)}) | sort_by(-(.success + .failure))[]",
              "columns": [
                {
                  "selector": "model",
                  "text": "Final model",
                  "type": "string"
                },
                {
                  "selector": "success",
                  "text": "Successful",
                  "type": "number"
                },
                {
                  "selector": "failure",
                  "text": "Failed",
                  "type": "number"
                }
              ]
            }
          ],
          "options": {
            "orientation": "horizontal",
            "xField": "model",
            "stacking": "normal",
            "showValue": "always",
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "barRadius": 0,
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0,
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Successful"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "repeat": "alias",
          "repeatDirection": "v",
          "maxPerRow": 1
        },
        {
          "id": 5,
          "type": "barchart",
          "title": "${alias:text} · final models · tokens (30d)",
          "description": "Recorded input+output token volume per configured final leaf model, 30d, using OmniRoute combo forecast historical aggregates. Models with zero recorded tokens are included. Total tokens (not separate input/output); no intermediate Combo nodes.",
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "omniroute-api"
          },
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "omniroute-api"
              },
              "refId": "A",
              "type": "json",
              "format": "table",
              "source": "url",
              "parser": "jq-backend",
              "url": "http://omniroute.llm-runtime.svc.cluster.local:20128/api/usage/combo-forecast?range=30d&horizon=30d&comboId=${alias:raw}",
              "url_options": {
                "method": "GET"
              },
              "root_selector": "[.combos[].targets[]? | select(.model != null and .model != \"\") | {model: .model, tokens: (.history.totalTokens // 0)}] | group_by(.model) | map({model: .[0].model, tokens: (map(.tokens) | add // 0)}) | sort_by(-.tokens)[]",
              "columns": [
                {
                  "selector": "model",
                  "text": "Final model",
                  "type": "string"
                },
                {
                  "selector": "tokens",
                  "text": "Input + output tokens",
                  "type": "number"
                }
              ]
            }
          ],
          "options": {
            "orientation": "horizontal",
            "xField": "model",
            "stacking": "normal",
            "showValue": "always",
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "barRadius": 0,
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0,
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "repeat": "alias",
          "repeatDirection": "v",
          "maxPerRow": 1
        }
      ]
    }
