apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute-redis
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: omniroute-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: llm-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omniroute-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniroute-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: llm-runtime
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:8.6.5-alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --save, "", --appendonly, "no", --loglevel, warning]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute-redis
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: omniroute-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: llm-runtime
spec:
  selector:
    app.kubernetes.io/name: omniroute-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
