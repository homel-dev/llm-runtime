apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-runtime

resources:
  - pvc.yml
  - redis.yml
  - deployment.yml
  - openai-gateway-service.yml
  - networkpolicy.yml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: omniroute
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omniroute
      spec:
        template:
          spec:
            containers:
              - name: omniroute
                env:
                  - name: OMNIROUTE_OTEL_ENDPOINT
                    value: http://alloy.llm-runtime.svc.cluster.local:4318
                  - name: OTEL_SERVICE_NAME
                    value: llm-runtime-omniroute
