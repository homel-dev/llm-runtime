apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: omniroute
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: llm-runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omniroute
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniroute
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: llm-runtime
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: omniroute
          image: omniroute:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 20128
          env:
            - { name: PORT, value: "20128" }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: DATA_DIR, value: /app/data }
            - { name: BASE_URL, value: "http://127.0.0.1:20128" }
            - { name: NEXT_PUBLIC_BASE_URL, value: "http://localhost:20128" }
            - { name: REQUIRE_API_KEY, value: "false" }
            - { name: OMNIROUTE_ALLOW_LOCAL_PROVIDER_URLS, value: "true" }
            - { name: AUTH_COOKIE_SECURE, value: "false" }
            - { name: APP_LOG_TO_FILE, value: "true" }
            - { name: REDIS_URL, value: "redis://omniroute-redis:6379" }
            - { name: OMNIROUTE_MEMORY_MB, value: "8192" }
            - { name: LIVE_WS_PORT, value: "20132" }
            - { name: LIVE_WS_HOST, value: "127.0.0.1" }
            - { name: LIVE_WS_ALLOWED_ORIGINS, value: "http://localhost:20128,http://127.0.0.1:20128" }
            - { name: STORAGE_ENCRYPTION_KEY_VERSION, value: v1 }
            # All startup configuration inputs; defaults and explanations live
            # at the top of k8s/gitops/omniroute/startup.sh.
            - { name: OR_BASE_URL, value: "http://127.0.0.1:20128" }
            - { name: OR_CLI, value: /app/bin/omniroute.mjs }
            - { name: OR_WAIT_SECONDS, value: "240" }
            - name: OR_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef: { name: omniroute-operator-token, key: token, optional: true }
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef: { name: rr-zai-coding, key: api-key }
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef: { name: rr-opencode-zen, key: api-key }
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef: { name: omniroute-runtime, key: initial-password }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: omniroute-runtime, key: jwt-secret }
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef: { name: omniroute-runtime, key: api-key-secret }
            - name: STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: omniroute-runtime, key: storage-encryption-key }
            - name: MACHINE_ID_SALT
              valueFrom:
                secretKeyRef: { name: omniroute-runtime, key: machine-id-salt }
            - name: OMNIROUTE_WS_BRIDGE_SECRET
              valueFrom:
                secretKeyRef: { name: omniroute-runtime, key: ws-bridge-secret }
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: startup-script
              mountPath: /etc/omniroute-startup
              readOnly: true
            - name: codex-auth
              mountPath: /codex-auth
              readOnly: true
            - name: agy-auth
              mountPath: /agy-auth
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command: [sh, /etc/omniroute-startup/startup.sh]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "4", memory: "12Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omniroute-data
        - name: tmp
          emptyDir: {}
        - name: startup-script
          configMap:
            name: omniroute-startup-script
        - name: codex-auth
          persistentVolumeClaim:
            claimName: rr-openai-subscription-auth
            readOnly: true
        - name: agy-auth
          persistentVolumeClaim:
            claimName: rr-gemini-subscription-auth
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: omniroute
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: llm-runtime
spec:
  selector:
    app.kubernetes.io/name: omniroute
  ports:
    - name: http
      protocol: TCP
      port: 20128
      targetPort: http
