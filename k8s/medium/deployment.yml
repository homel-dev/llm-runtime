# k8s/medium/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-medium
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-medium
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: medium

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-medium

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-medium
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: medium

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent

          args:
            - Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.90"
            - --max-num-seqs
            - "4"
            - --enforce-eager

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

            - name: HUGGINGFACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN

            - name: NVIDIA_VISIBLE_DEVICES
              value: GPU-0de7cad3-de92-f02d-31b1-c0400359ef20

            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90

          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-medium
