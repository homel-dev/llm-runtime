# k8s/medium/deployment.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-medium
  namespace: llm-runtime
  labels:
    app.kubernetes.io/name: llm-medium
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-runtime
    llm.runtime/tier: medium

spec:

  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-medium

  template:

    metadata:
      labels:
        app.kubernetes.io/name: llm-medium
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-runtime
        llm.runtime/tier: medium

    spec:

      containers:

        - name: vllm

          image: vllm/vllm-openai:latest

          imagePullPolicy: IfNotPresent

          args:
            - --model
            - Qwen/Qwen2.5-Coder-14B-Instruct

            - --host
            - "0.0.0.0"

            - --port
            - "8000"

            - --max-model-len
            - "8192"

            - --gpu-memory-utilization
            - "0.85"

            - --max-num-seqs
            - "8"

          env:
            - name: HF_HOME
              value: /root/.cache/huggingface

          ports:
            - name: http
              containerPort: 8000

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          resources:
            limits:
              nvidia.com/gpu: "1"

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-medium
