name: Gateway image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-image.yml"
  workflow_dispatch:

concurrency:
  group: gateway-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify gateway
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Verify gateway
        working-directory: gateway
        run: |
          npm ci --ignore-scripts
          npm run verify

  build-pr:
    name: Build gateway image (PR)
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image without publishing
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=llm-runtime-gateway
          cache-to: type=gha,mode=max,scope=llm-runtime-gateway
          sbom: true
          provenance: mode=max

  publish:
    name: Build and publish gateway image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/llm-runtime-gateway"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llm-runtime-gateway
          cache-to: type=gha,mode=max,scope=llm-runtime-gateway
          sbom: true
          provenance: mode=max

      - name: Publish image digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Gateway image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
