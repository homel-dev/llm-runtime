name: OmniRoute image

on:
  push:
    branches: [main]
    paths:
      - 'omniroute/**'
      - '.github/workflows/omniroute-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'omniroute/**'
      - '.github/workflows/omniroute-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build OmniRoute with CLI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./omniroute
          file: ./omniroute/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/llm-runtime-omniroute:main
          cache-from: type=gha,scope=llm-runtime-omniroute
          cache-to: type=gha,mode=max,scope=llm-runtime-omniroute
          sbom: true
          provenance: mode=max
