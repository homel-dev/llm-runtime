name: OmniRoute alias sync image
on:
  push:
    branches: [main]
    paths:
      - k8s/gitops/omniroute/alias-sync-image/**
      - .github/workflows/omniroute-alias-sync-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: k8s/gitops/omniroute/alias-sync-image
          platforms: linux/amd64
          push: true
          tags: ghcr.io/homel-dev/llm-runtime-omniroute-alias-sync:main
